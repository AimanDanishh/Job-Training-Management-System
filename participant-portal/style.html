<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --primary-light: #EFF6FF;
    --success: #16A34A;
    --success-bg: #F0FDF4;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --warning: #D97706;
    --warning-bg: #FFFBEB;
    --bg-app: #F8FAFC;
    --card-bg: #FFFFFF;
    --border-color: #E2E8F0;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-app);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .portal-container {
    width: 100%;
    max-width: 580px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .portal-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #F1F5F9;
  }

  .badge-pillar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 99px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .portal-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .portal-subtitle {
    font-size: 13.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .meta-pills-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12.5px;
    color: var(--text-secondary);
    background: #F1F5F9;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }

  .form-label .req {
    color: var(--danger);
    margin-left: 2px;
  }

  .form-control {
    width: 100%;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: #FFFFFF;
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-md);
    transition: all 0.15s ease-in-out;
    outline: none;
  }

  .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  textarea.form-control {
    resize: vertical;
    min-height: 80px;
  }

  .btn-submit {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--primary);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background-color 0.15s ease-in-out, transform 0.1s ease;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }

  .btn-submit:hover {
    background: var(--primary-hover);
  }

  .btn-submit:active {
    transform: scale(0.99);
  }

  .btn-submit:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  /* Likert Rating Styling */
  .likert-question-block {
    padding: 14px 0;
    border-bottom: 1px solid #F1F5F9;
  }

  .likert-q-text {
    font-size: 13px;
    font-weight: 600;
    color: #1E293B;
    margin-bottom: 2px;
  }

  .likert-q-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 10px;
  }

  .likert-btn-group {
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }

  .likert-btn {
    flex: 1;
    height: 42px;
    border-radius: 8px;
    border: 1.5px solid var(--border-color);
    background: #FFFFFF;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .likert-btn.active-1, .likert-btn.active-2 {
    border-color: var(--danger);
    background: var(--danger-bg);
    color: var(--danger);
  }

  .likert-btn.active-3 {
    border-color: var(--warning);
    background: var(--warning-bg);
    color: var(--warning);
  }

  .likert-btn.active-4, .likert-btn.active-5 {
    border-color: var(--success);
    background: var(--success-bg);
    color: var(--success);
  }

  /* Radio Pill Options */
  .radio-pill-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .radio-pill-item {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border-color);
    background: #FFFFFF;
    cursor: pointer;
    transition: all 0.12s ease;
    font-size: 13px;
    color: #334155;
  }

  .radio-pill-item.active {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }

  /* Loading Spinner */
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(37, 99, 235, 0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Toast Notification */
  #toast-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: #FFFFFF;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s ease;
    pointer-events: auto;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .toast-success { background: #16A34A; }
  .toast-error   { background: #DC2626; }
  .toast-info    { background: #2563EB; }
</style>
