<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg-main: #0F172A;
    --bg-secondary: #151F32;
    --bg-card: #182338;
    --bg-input: #121C2D;
    
    --text-primary: #F1F5F9;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    
    --border-color: #26344D;
    
    --primary: #60A5FA;
    --primary-hover: #3B82F6;
    --primary-light: rgba(96, 165, 250, 0.15);
    
    --btn-primary-bg: #F8FAFC;
    --btn-primary-text: #0F172A;
    
    --success: #34D399;
    --success-bg: rgba(52, 211, 153, 0.15);
    
    --warning: #FBBF24;
    --warning-bg: rgba(251, 191, 36, 0.15);
    
    --danger: #F87171;
    --danger-bg: rgba(248, 113, 113, 0.15);
    
    /* Dark Neomorphism Shadows */
    --shadow-raised: 10px 10px 24px rgba(0, 0, 0, 0.40), -6px -6px 18px rgba(255, 255, 255, 0.025);
    --shadow-raised-sm: 6px 6px 16px rgba(0, 0, 0, 0.30), -4px -4px 12px rgba(255, 255, 255, 0.02);
    --shadow-hover: 12px 12px 28px rgba(0, 0, 0, 0.50), -6px -6px 20px rgba(255, 255, 255, 0.035);
    --shadow-inset: inset 4px 4px 10px rgba(0, 0, 0, 0.45), inset -3px -3px 8px rgba(255, 255, 255, 0.02);
    --shadow-inset-deep: inset 5px 5px 12px rgba(0, 0, 0, 0.55), inset -3px -3px 8px rgba(255, 255, 255, 0.025);
    
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --radius-full: 9999px;
  }

  /* Light Theme Variables */
  body.theme-light {
    --bg-main: #EEF2F7;
    --bg-secondary: #EEF2F7;
    --bg-card: #FFFFFF;
    --bg-input: #F1F5F9;
    
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    
    --border-color: #CBD5E1;
    
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --primary-light: rgba(37, 99, 235, 0.12);
    
    --btn-primary-bg: #2563EB;
    --btn-primary-text: #FFFFFF;
    
    --success: #16A34A;
    --success-bg: rgba(22, 163, 74, 0.12);
    
    --warning: #D97706;
    --warning-bg: rgba(217, 119, 6, 0.12);
    
    --danger: #DC2626;
    --danger-bg: rgba(220, 38, 38, 0.12);
    
    --shadow-raised: 8px 8px 16px #c5d0e0, -8px -8px 16px #ffffff;
    --shadow-raised-sm: 4px 4px 10px #c5d0e0, -4px -4px 10px #ffffff;
    --shadow-hover: 10px 10px 20px #beccdf, -10px -10px 20px #ffffff;
    --shadow-inset: inset 3px 3px 6px #c5d0e0, inset -3px -3px 6px #ffffff;
    --shadow-inset-deep: inset 4px 4px 8px #bec9db, inset -4px -4px 8px #ffffff;
  }

  /* Fixed Top-Right Theme & Language Toggle Buttons */
  .top-actions-container {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .top-actions-container .theme-toggle-btn {
    position: static;
  }

  .lang-toggle-btn {
    padding: 8px 14px;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: var(--shadow-raised-sm);
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    transition: all 0.25s ease;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    outline: none;
  }

  .lang-toggle-btn:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
    border-color: var(--primary);
    color: var(--primary);
  }

  .theme-toggle-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: var(--shadow-raised-sm);
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    transition: all 0.25s ease;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
  }

  .theme-toggle-btn:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .portal-container {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }

  .portal-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-raised);
    padding: 32px 28px;
    margin-bottom: 24px;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
  }

  .badge-pillar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid rgba(96, 165, 250, 0.3);
    border-radius: var(--radius-full);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .portal-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .portal-subtitle {
    font-size: 13.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .meta-pills-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12.5px;
    color: var(--text-secondary);
    background: var(--bg-input);
    box-shadow: var(--shadow-inset);
    border: 1px solid var(--border-color);
    padding: 10px 16px;
    border-radius: var(--radius-md);
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .info-details-box {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-inset);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 20px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(38, 52, 77, 0.5);
    font-size: 13.5px;
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-label {
    color: var(--text-secondary);
    font-weight: 500;
  }

  .info-value {
    color: var(--text-primary);
    font-weight: 700;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: 0.01em;
  }

  .form-label .req {
    color: var(--danger);
    margin-left: 2px;
  }

  .form-control {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-inset);
    transition: all 0.2s ease;
    outline: none;
  }

  .form-control:focus {
    border-color: var(--primary);
    box-shadow: var(--shadow-inset-deep), 0 0 0 2px rgba(96, 165, 250, 0.2);
  }

  textarea.form-control {
    resize: vertical;
    min-height: 90px;
  }

  .btn-submit {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 800;
    color: var(--btn-primary-text);
    background: var(--btn-primary-bg);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-raised-sm);
  }

  .btn-submit:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
    opacity: 0.95;
  }

  .btn-submit:active {
    transform: scale(0.99);
  }

  .btn-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-raised-sm);
  }

  .btn-secondary:hover {
    color: var(--primary);
    border-color: var(--primary);
  }

  /* Likert Rating Styling */
  .likert-question-block {
    padding: 16px 0;
    border-bottom: 1px solid var(--border-color);
  }

  .likert-q-text {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .likert-q-sub {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  .likert-btn-group {
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }

  .likert-btn {
    flex: 1;
    height: 44px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    background: var(--bg-input);
    box-shadow: var(--shadow-inset);
    font-size: 15px;
    font-weight: 800;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .likert-btn.active-1, .likert-btn.active-2 {
    border-color: var(--danger);
    background: var(--danger-bg);
    color: var(--danger);
    box-shadow: 0 0 10px rgba(248, 113, 113, 0.2);
  }

  .likert-btn.active-3 {
    border-color: var(--warning);
    background: var(--warning-bg);
    color: var(--warning);
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
  }

  .likert-btn.active-4, .likert-btn.active-5 {
    border-color: var(--success);
    background: var(--success-bg);
    color: var(--success);
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
  }

  /* Radio Pill Options */
  .radio-pill-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .radio-pill-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background: var(--bg-input);
    box-shadow: var(--shadow-inset);
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 13.5px;
    color: var(--text-secondary);
  }

  .radio-pill-item.active {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.2);
  }

  /* Loading Spinner */
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(96, 165, 250, 0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Toast Notification */
  #toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    padding: 12px 24px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    font-weight: 700;
    color: #FFFFFF;
    box-shadow: var(--shadow-raised);
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.25s ease;
    pointer-events: auto;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .toast-success { background: #059669; border: 1px solid #34D399; }
  .toast-error   { background: #DC2626; border: 1px solid #F87171; }
  .toast-info    { background: #2563EB; border: 1px solid #60A5FA; }
</style>
