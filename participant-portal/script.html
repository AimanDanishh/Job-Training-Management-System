<script>
  /**
   * Universal async wrapper for calling backend Google Apps Script functions.
   */
  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('Google Apps Script environment not detected.'));
        return;
      }

      google.script.run
        .withSuccessHandler((jsonStr) => {
          try {
            const res = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
            if (res && res.success) {
              resolve(res.data);
            } else {
              reject(new Error((res && res.message) ? res.message : 'Server returned error status.'));
            }
          } catch (e) {
            reject(new Error('Failed to parse server response: ' + e.message));
          }
        })
        .withFailureHandler((err) => {
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        [functionName](...args);
    });
  }

  /**
   * Helper to retrieve URL Query Parameters
   */
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param) || '';
  }

  /**
   * Helper to display non-blocking Toast messages
   */
  function showToast(message, type = 'info') {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => { toast.classList.add('show'); }, 10);

    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => { toast.remove(); }, 300);
    }, 4000);
  }

  /**
   * Helper to toggle button loading states
   */
  function setBtnLoading(btn, isLoading, loadingText = 'Submitting...') {
    if (!btn) return;
    if (isLoading) {
      btn.dataset.originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;margin:0 4px 0 0;vertical-align:middle"></span> ${loadingText}`;
    } else {
      btn.disabled = false;
      if (btn.dataset.originalHtml) {
        btn.innerHTML = btn.dataset.originalHtml;
      }
    }
  }

  /**
   * Theme Manager (Dark / Light Theme Toggle)
   */
  function initTheme() {
    const savedTheme = localStorage.getItem('portal_theme') || 'dark';
    applyTheme(savedTheme);
  }

  function toggleTheme() {
    const isLight = document.body.classList.contains('theme-light');
    const newTheme = isLight ? 'dark' : 'light';
    applyTheme(newTheme);
    localStorage.setItem('portal_theme', newTheme);
  }

  function applyTheme(theme) {
    const icon = document.getElementById('themeToggleIcon');
    const label = document.getElementById('themeToggleLabel');

    if (theme === 'light') {
      document.body.classList.remove('theme-dark');
      document.body.classList.add('theme-light');
      if (icon) icon.innerText = '☀️';
      if (label) label.innerText = 'Light';
    } else {
      document.body.classList.remove('theme-light');
      document.body.classList.add('theme-dark');
      if (icon) icon.innerText = '🌙';
      if (label) label.innerText = 'Dark';
    }
  }

  function formatMinimalistDate(dateVal) {
    if (!dateVal) return '—';
    const str = String(dateVal).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
    const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (dmyMatch) return `${dmyMatch[1].padStart(2, '0')}/${dmyMatch[2].padStart(2, '0')}/${dmyMatch[3]}`;
    const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (ymdMatch) return `${ymdMatch[3].padStart(2, '0')}/${ymdMatch[2].padStart(2, '0')}/${ymdMatch[1]}`;
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    }
    return str.split('T')[0] || '—';
  }

  function formatDisplayTime(val, defaultTime = '09:00 AM') {
    if (!val) return defaultTime;
    const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
    
    const ampmMatch = str.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
    if (ampmMatch && !str.includes('1899') && !str.includes('Singapore') && !str.includes('Standard') && !str.includes('GMT')) {
      let hh = parseInt(ampmMatch[1], 10);
      const mm = ampmMatch[2];
      const ampm = ampmMatch[3] ? ampmMatch[3].toUpperCase() : (hh >= 12 ? 'PM' : 'AM');
      if (hh > 12) hh = hh % 12;
      if (hh === 0) hh = 12;
      return `${String(hh).padStart(2, '0')}:${mm} ${ampm}`;
    }

    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      return `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
    }
    return defaultTime;
  }

  function formatSessionTimeRange(startVal, endVal) {
    const sTime = formatDisplayTime(startVal, '09:00 AM');
    const eTime = formatDisplayTime(endVal, '05:00 PM');
    return `${sTime} - ${eTime}`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
  });
</script>
