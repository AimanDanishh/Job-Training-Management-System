<script>
  let masterTrainingsList = [];
  let masterCostCentresList = [];
  let activeReportType = 'master';

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const [trainings, depts] = await Promise.all([
        callServer('getTrainings'),
        callServer('getCostCentres').catch(() => [])
      ]);

      masterTrainingsList = Array.isArray(trainings) ? trainings : [];
      masterCostCentresList = Array.isArray(depts) ? depts : [];

      // Populate Training Title dropdown
      const selTitle = document.getElementById('filter-training-title');
      if (selTitle) {
        selTitle.innerHTML = '<option value="">All Training Titles</option>' +
          masterTrainingsList.map(t => `<option value="${t.Name}">[${t.Code}] ${t.Name}</option>`).join('');
      }

      // Populate Cost Centre dropdown
      const selDept = document.getElementById('filter-dept');
      if (selDept) {
        selDept.innerHTML = '<option value="">All Cost Centres / Departments</option>' +
          masterCostCentresList.map(d => `<option value="${d}">${d}</option>`).join('');
      }

      // Read URL query parameter for page deep-linking
      const qpReport = getQueryParam('type');
      const qpId     = getQueryParam('id');

      if (qpReport) {
        document.getElementById('filter-report-type').value = qpReport;
      } else if (qpId) {
        document.getElementById('filter-report-type').value = 'single';
        document.getElementById('filter-training-title').value = qpId;
      }

      onReportTypeChange();
      generateSelectedReport();

    } catch(e) {
      showToast('Error initializing report filter options: ' + e.message, 'error');
    }
  });

  function onReportTypeChange() {
    activeReportType = document.getElementById('filter-report-type').value;
    const titleContainer = document.getElementById('title-filter-container');

    if (activeReportType === 'single') {
      if (titleContainer) titleContainer.style.display = 'block';
    } else {
      if (titleContainer) titleContainer.style.display = 'block';
    }
  }

  function getActiveFilters() {
    return {
      year:       document.getElementById('filter-year').value,
      month:      document.getElementById('filter-month').value,
      costCentre: document.getElementById('filter-dept').value,
      title:      document.getElementById('filter-training-title').value
    };
  }

  async function generateSelectedReport() {
    activeReportType = document.getElementById('filter-report-type').value;
    const filters = getActiveFilters();

    const outputCard = document.getElementById('report-output-card');
    const loadingEl  = document.getElementById('report-loading');
    const tableContainer = document.getElementById('report-table-container');

    if (outputCard) outputCard.style.display = 'none';
    if (loadingEl)  loadingEl.style.display = 'block';

    try {
      if (activeReportType === 'single') {
        const selTitle = filters.title;
        let matchedT = masterTrainingsList.find(t => t.Name === selTitle || t.ID === selTitle || t.Code === selTitle);
        if (!matchedT && masterTrainingsList.length > 0) matchedT = masterTrainingsList[0];

        if (!matchedT) {
          showToast('No training programme selected.', 'error');
          return;
        }

        const reportData = await callServer('generateReport', matchedT.ID);
        renderSingleProgrammeReport(reportData);
      } else if (activeReportType === 'master') {
        renderMasterReportPreview(filters);
      } else {
        const res = await callServer('getFilteredReportData', activeReportType, filters);
        renderCustomReportTable(activeReportType, res, filters);
      }
      if (outputCard) outputCard.style.display = 'block';
    } catch(e) {
      showToast('Failed to generate report: ' + e.message, 'error');
    } finally {
      if (loadingEl) loadingEl.style.display = 'none';
    }
  }

  async function renderMasterReportPreview(filters) {
    const titleEl = document.getElementById('report-output-title');
    const subEl   = document.getElementById('report-output-sub');
    const tableContainer = document.getElementById('report-table-container');

    const year = filters.year || '2026';
    titleEl.textContent = `★ ALL-IN-ONE Master Training Report Workbook (${year})`;
    subEl.textContent   = `Master workbook combining 5 distinct report tabs: Training Hours, Training Cost, Training Title, Employee, and Annual Training Plan (ATP)`;

    const [hoursRes, costRes, titleRes, empRes, atpRes] = await Promise.all([
      callServer('getFilteredReportData', 'hours', filters).catch(() => ({ rows: [] })),
      callServer('getFilteredReportData', 'cost', filters).catch(() => ({ rows: [] })),
      callServer('getFilteredReportData', 'title', filters).catch(() => ({ rows: [] })),
      callServer('getFilteredReportData', 'employee', filters).catch(() => ({ rows: [] })),
      callServer('getFilteredReportData', 'atp', filters).catch(() => ({ rows: [] }))
    ]);

    tableContainer.innerHTML = `
      <div style="padding:20px; background:#F8FAFC">
        <div style="background:#EFF6FF; border:1px solid #BFDBFE; border-radius:10px; padding:16px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px">
          <div>
            <div style="font-size:15px; font-weight:800; color:#1D4ED8; display:flex; align-items:center; gap:8px">
              <span class="icon filled sm" style="color:#2563EB">library_books</span> Multi-Tab Master Report Package Ready
            </div>
            <div style="font-size:12px; color:#1E40AF; margin-top:2px">
              All 5 reports generated and formatted into individual sheets in one single master workbook file.
            </div>
          </div>
          <button class="btn-th" style="background:#7C3AED; color:#fff; border:none; font-weight:700; padding:10px 20px" onclick="exportMasterWorkbookDirect()">
            <span class="icon sm">download</span> Download Master Workbook (.xlsx)
          </button>
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <div class="card-th" style="border-top:4px solid #2563EB">
              <div style="font-size:12px; font-weight:700; color:#2563EB; text-transform:uppercase">Tab 1: Training Hours</div>
              <div style="font-size:18px; font-weight:800; color:#1E293B; margin:4px 0">${(hoursRes.rows || []).length} Cost Centres</div>
              <div style="font-size:11.5px; color:#64748B">Cost Centre vs Month matrix for ${year}</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card-th" style="border-top:4px solid #16A34A">
              <div style="font-size:12px; font-weight:700; color:#16A34A; text-transform:uppercase">Tab 2: Training Cost</div>
              <div style="font-size:18px; font-weight:800; color:#1E293B; margin:4px 0">${(costRes.rows || []).length} Programmes</div>
              <div style="font-size:11.5px; color:#64748B">Formatted cost breakdown & HRDF grant columns</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card-th" style="border-top:4px solid #0891B2">
              <div style="font-size:12px; font-weight:700; color:#0891B2; text-transform:uppercase">Tab 3: Training Title</div>
              <div style="font-size:18px; font-weight:800; color:#1E293B; margin:4px 0">${(titleRes.rows || []).length} Enrolled Entries</div>
              <div style="font-size:11.5px; color:#64748B">Employee details, dates, type & trainer</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card-th" style="border-top:4px solid #D97706">
              <div style="font-size:12px; font-weight:700; color:#D97706; text-transform:uppercase">Tab 4: Employee Report</div>
              <div style="font-size:18px; font-weight:800; color:#1E293B; margin:4px 0">${(empRes.rows || []).length} Employees</div>
              <div style="font-size:11.5px; color:#64748B">Total trainings attended & cumulative hours</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card-th" style="border-top:4px solid #7C3AED">
              <div style="font-size:12px; font-weight:700; color:#7C3AED; text-transform:uppercase">Tab 5: Annual Training Plan (ATP)</div>
              <div style="font-size:18px; font-weight:800; color:#1E293B; margin:4px 0">${(atpRes.rows || []).length} Plan Entries</div>
              <div style="font-size:11.5px; color:#64748B">Full annual plan matrix with planned/actual dates & pax</div>
            </div>
          </div>
        </div>

        <div style="margin-top:20px">
          <h4 style="font-size:14px; font-weight:700; color:#1E293B; margin-bottom:10px">Preview: Tab 1 — Training Hours (Cost Centre vs Month)</h4>
          ${buildHoursReportHtml(hoursRes, year)}
        </div>
      </div>
    `;
  }

  // ─── Render Single Custom Report Table ───────────────────────────────────────
  function renderCustomReportTable(type, data, filters) {
    const titleEl = document.getElementById('report-output-title');
    const subEl   = document.getElementById('report-output-sub');
    const tableContainer = document.getElementById('report-table-container');

    const year = filters.year || '2026';

    if (type === 'hours') {
      titleEl.textContent = `1. Training Hours Report (${year}) — Cost Centre vs Month`;
      subEl.textContent   = `Training hours breakdown per month across all Cost Centres / Departments for ${year}`;
      tableContainer.innerHTML = buildHoursReportHtml(data, year);
    } else if (type === 'cost') {
      titleEl.textContent = `2. Training Cost Report (${year})`;
      subEl.textContent   = `Training cost breakdown by Training Title, Dates, and Pax for ${year}`;
      tableContainer.innerHTML = buildCostReportHtml(data, year);
    } else if (type === 'title') {
      titleEl.textContent = `3. Training Title Report`;
      subEl.textContent   = `Participant list & training session details by Training Title`;
      tableContainer.innerHTML = buildTitleReportHtml(data);
    } else if (type === 'employee') {
      titleEl.textContent = `4. Employee Training Report`;
      subEl.textContent   = `Employee training attendance & total hours summary`;
      tableContainer.innerHTML = buildEmployeeReportHtml(data);
    } else if (type === 'atp') {
      titleEl.textContent = `Annual Training Plan (ATP) (${year})`;
      subEl.textContent   = `Master Annual Training Plan matrix including planned & actual dates, duration, pax, and category`;
      tableContainer.innerHTML = buildAtpReportHtml(data);
    }
  }

  // ─── 1. Training Hours HTML Builder ──────────────────────────────────────────
  function buildHoursReportHtml(data, year) {
    const monthHeaders = data.monthHeaders || ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].map(m => `${m}-${year.slice(-2)}`);
    const rows = data.rows || [];

    return `
      <table class="table-report">
        <thead>
          <tr>
            <th rowspan="2" style="min-width:180px">Cost Centre/Month</th>
            <th colspan="12">Training Hours</th>
            <th rowspan="2" style="min-width:100px">Total ${year}</th>
            <th rowspan="2" style="min-width:140px">Total Training Hours ${year}</th>
          </tr>
          <tr>
            ${monthHeaders.map(m => `<th>${m}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td style="font-weight:700; color:#1E293B; background:#F8FAFC">${r.costCentre}</td>
              ${(r.months || []).map(h => `<td style="text-align:center">${h > 0 ? `<strong>${h}</strong>` : '0'}</td>`).join('')}
              <td style="text-align:center; font-weight:800; color:#2563EB; background:#EFF6FF">${r.totalYear} hrs</td>
              <td style="text-align:center; font-weight:800; color:#059669; background:#ECFDF5">${r.totalHours} hrs</td>
            </tr>
          `).join('') : '<tr><td colspan="15" style="text-align:center; padding:24px; color:#94A3B8">No training hours data recorded for selected filters.</td></tr>'}
        </tbody>
      </table>
    `;
  }

  // ─── 2. Training Cost HTML Builder ───────────────────────────────────────────
  function buildCostReportHtml(data, year) {
    const rows = data.rows || [];

    return `
      <table class="table-report">
        <thead>
          <tr>
            <th rowspan="2" style="min-width:200px">Training Title</th>
            <th rowspan="2">Training Date (From)</th>
            <th rowspan="2">Training Date (To)</th>
            <th rowspan="2">Total Participant</th>
            <th colspan="8">Training Cost (RM)</th>
            <th rowspan="2">Total Cost ${year}</th>
            <th rowspan="2">Total HRDF Grant (RM)</th>
          </tr>
          <tr>
            <th>Training Fees</th>
            <th>Meal</th>
            <th>Subsistance Allowance</th>
            <th>Hotel Fees</th>
            <th>Mileage Claim</th>
            <th>Taxi Fees</th>
            <th>Toll Fees</th>
            <th>Flight</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td style="font-weight:700; color:#1E293B">${r.trainingTitle}</td>
              <td style="text-align:center">${r.dateFrom}</td>
              <td style="text-align:center">${r.dateTo}</td>
              <td style="text-align:center; font-weight:700; color:#2563EB">${r.totalParticipant} pax</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; color:#94A3B8">—</td>
              <td style="text-align:center; font-weight:700; color:#16A34A">RM ${r.totalCost || '0.00'}</td>
              <td style="text-align:center; color:#94A3B8">—</td>
            </tr>
          `).join('') : '<tr><td colspan="14" style="text-align:center; padding:24px; color:#94A3B8">No cost records found for selected filters.</td></tr>'}
        </tbody>
      </table>
    `;
  }

  // ─── 3. Training Title Report HTML Builder ───────────────────────────────────
  function buildTitleReportHtml(data) {
    const rows = data.rows || [];

    return `
      <table class="table-report">
        <thead>
          <tr>
            <th>Name</th>
            <th>Emp. No</th>
            <th>Training Title</th>
            <th>(EE)/Cost Centre Description</th>
            <th>Training Type</th>
            <th>Date (From)</th>
            <th>Date (Until)</th>
            <th>Month</th>
            <th>Total Hours</th>
            <th>Trainer</th>
            <th>Training Provide</th>
            <th>Expiry Date (if applicable)</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td style="font-weight:700; color:#1E293B">${r.name}</td>
              <td style="font-family:monospace; font-weight:700; color:#2563EB">${r.empNo}</td>
              <td style="font-weight:600">${r.trainingTitle}</td>
              <td>${r.costCentreDesc}</td>
              <td><span class="badge-th badge-blue">${r.trainingType}</span></td>
              <td style="text-align:center">${r.dateFrom}</td>
              <td style="text-align:center">${r.dateUntil}</td>
              <td style="text-align:center">${r.month}</td>
              <td style="text-align:center; font-weight:700">${r.totalHours} hrs</td>
              <td>${r.trainer}</td>
              <td>${r.trainingProvider}</td>
              <td style="text-align:center; color:#94A3B8">${r.expiryDate}</td>
            </tr>
          `).join('') : '<tr><td colspan="12" style="text-align:center; padding:24px; color:#94A3B8">No records found.</td></tr>'}
        </tbody>
      </table>
    `;
  }

  // ─── 4. Employee Report HTML Builder ─────────────────────────────────────────
  function buildEmployeeReportHtml(data) {
    const rows = data.rows || [];

    return `
      <table class="table-report">
        <thead>
          <tr>
            <th>No</th>
            <th>Emp. No</th>
            <th>Employee Name</th>
            <th>Cost Centre / Department</th>
            <th>Position</th>
            <th>Total Trainings</th>
            <th>Total Hours Completed</th>
            <th>Attended Trainings</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td style="text-align:center; font-weight:700">${r.no}</td>
              <td style="font-family:monospace; font-weight:700; color:#2563EB">${r.empNo}</td>
              <td style="font-weight:700; color:#1E293B">${r.name}</td>
              <td>${r.costCentre}</td>
              <td>${r.position}</td>
              <td style="text-align:center; font-weight:700; color:#2563EB">${r.totalTrainings}</td>
              <td style="text-align:center; font-weight:800; color:#059669">${r.totalHours} hrs</td>
              <td style="font-size:11.5px; color:#64748B">${r.attendedList.join(', ') || '—'}</td>
              <td>${statusBadge(r.status)}</td>
            </tr>
          `).join('') : '<tr><td colspan="9" style="text-align:center; padding:24px; color:#94A3B8">No employee records found.</td></tr>'}
        </tbody>
      </table>
    `;
  }

  // ─── 5. ATP Report HTML Builder ──────────────────────────────────────────────
  function buildAtpReportHtml(data) {
    const rows = data.rows || [];

    return `
      <table class="table-report">
        <thead>
          <tr>
            <th>No</th>
            <th>Training Title</th>
            <th>Training Category</th>
            <th>TNA Source</th>
            <th>Training Mode</th>
            <th>Training Duration (hrs)</th>
            <th>Trainer</th>
            <th>Department</th>
            <th>Position / Employee No</th>
            <th>Total Pax</th>
            <th>Planned Date</th>
            <th>Actual Date (From)</th>
            <th>Actual Date (To)</th>
            <th>Training Status</th>
            <th>Remarks</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td style="text-align:center; font-weight:700">${r.no}</td>
              <td style="font-weight:700; color:#1E293B">${r.trainingTitle}</td>
              <td><span class="badge-th badge-purple">${r.trainingCategory}</span></td>
              <td>${r.tnaSource}</td>
              <td>${r.trainingMode}</td>
              <td style="text-align:center; font-weight:700; color:#2563EB">${r.durationHours} hrs</td>
              <td>${r.trainer}</td>
              <td>${r.department}</td>
              <td>${r.positionEmpNo}</td>
              <td style="text-align:center; font-weight:700">${r.totalPax} pax</td>
              <td style="text-align:center">${r.plannedDate}</td>
              <td style="text-align:center">${r.actualDateFrom}</td>
              <td style="text-align:center">${r.actualDateTo}</td>
              <td>${statusBadge(r.trainingStatus)}</td>
              <td style="font-size:11.5px; color:#64748B">${r.remarks}</td>
            </tr>
          `).join('') : '<tr><td colspan="15" style="text-align:center; padding:24px; color:#94A3B8">No Annual Training Plan entries found for selected filters.</td></tr>'}
        </tbody>
      </table>
    `;
  }

  // ─── Single Programme Report Renderer ────────────────────────────────────────
  function renderSingleProgrammeReport(report) {
    const titleEl = document.getElementById('report-output-title');
    const subEl   = document.getElementById('report-output-sub');
    const tableContainer = document.getElementById('report-table-container');

    const t = report.training;
    titleEl.textContent = `6. Single Programme Report — [${t.Code}] ${t.Name}`;
    subEl.textContent   = `Full detail summary for ${t.Name} generated on ${report.generatedAt}`;

    const att = report.attendance || {};
    const days = att.days || [];

    tableContainer.innerHTML = `
      <div style="padding:16px">
        <div class="row g-3 mb-4">
          <div class="col-md-3"><div class="stat-card"><div class="stat-value" style="color:#2563EB">${t.Category}</div><div class="stat-label">Category</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="stat-value" style="color:#16A34A">${t.Trainer}</div><div class="stat-label">Trainer</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="stat-value" style="color:#D97706">${t.Participants || 0} pax</div><div class="stat-label">Enrolled Pax</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="stat-value" style="color:#7C3AED">RM ${t.CourseFee || '0.00'}</div><div class="stat-label">Course Fee</div></div></div>
        </div>

        <h4 style="font-size:14px; font-weight:700; color:#1E293B; margin-bottom:10px">Attendance Breakdown by Day</h4>
        <table class="table-report mb-4">
          <thead>
            <tr><th>Day</th><th>Date</th><th>Total Records</th><th>Present</th><th>Absent</th><th>Late</th><th>Rate (%)</th></tr>
          </thead>
          <tbody>
            ${days.length ? days.map(d => {
              const recs = d.records || [];
              const pres = recs.filter(r => r.Status === 'Present').length;
              const abs  = recs.filter(r => r.Status === 'Absent').length;
              const late = recs.filter(r => r.Status === 'Late').length;
              const pct  = recs.length ? Math.round(pres / recs.length * 100) : 0;
              return `<tr>
                <td style="font-weight:700">Day ${d.day}</td>
                <td>${d.date}</td>
                <td>${recs.length}</td>
                <td style="color:#16A34A; font-weight:bold">${pres}</td>
                <td style="color:#DC2626; font-weight:bold">${abs}</td>
                <td style="color:#D97706">${late}</td>
                <td><strong>${pct}%</strong></td>
              </tr>`;
            }).join('') : '<tr><td colspan="7" style="text-align:center; padding:16px; color:#94A3B8">No attendance records registered.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }

  // ─── Export Actions ─────────────────────────────────────────────────────────
  async function exportExcelCurrentReport() {
    activeReportType = document.getElementById('filter-report-type').value;
    const filters = getActiveFilters();

    showToast('Exporting to Excel spreadsheet...', 'info');

    try {
      if (activeReportType === 'single') {
        const selTitle = filters.title;
        let matchedT = masterTrainingsList.find(t => t.Name === selTitle || t.ID === selTitle || t.Code === selTitle);
        if (!matchedT && masterTrainingsList.length > 0) matchedT = masterTrainingsList[0];
        if (!matchedT) return;

        const res = await callServer('exportReportExcel', matchedT.ID);
        if (res && (res.downloadUrl || res.sheetUrl)) {
          window.open(res.downloadUrl || res.sheetUrl, '_blank');
          showToast('Excel report ready! Opening spreadsheet...', 'success');
        }
      } else {
        const res = await callServer('exportFilteredReportExcel', activeReportType, filters);
        if (res && (res.downloadUrl || res.sheetUrl)) {
          window.open(res.downloadUrl || res.sheetUrl, '_blank');
          showToast(res.message || 'Excel file generated! Downloading .xlsx / opening sheet...', 'success');
        }
      }
    } catch(e) {
      showToast('Export failed: ' + e.message, 'error');
    }
  }

  async function exportMasterWorkbookDirect() {
    const filters = getActiveFilters();
    showToast('Generating Master All-in-One Report Workbook (All 5 Tabs)...', 'info');

    try {
      const res = await callServer('exportAllInOneMasterReportExcel', filters);
      if (res && (res.downloadUrl || res.sheetUrl)) {
        window.open(res.downloadUrl || res.sheetUrl, '_blank');
        showToast('Master 5-Tab Workbook ready! Opening in Google Sheets...', 'success');
      }
    } catch(e) {
      showToast('Master export failed: ' + e.message, 'error');
    }
  }

  async function exportPdfCurrentReport() {
    const filters = getActiveFilters();
    const selTitle = filters.title;
    let matchedT = masterTrainingsList.find(t => t.Name === selTitle || t.ID === selTitle || t.Code === selTitle);
    if (!matchedT && masterTrainingsList.length > 0) matchedT = masterTrainingsList[0];
    if (!matchedT) {
      showToast('Please select a training title for PDF generation.', 'error');
      return;
    }

    showToast('Generating PDF report...', 'info');
    try {
      const res = await callServer('exportReportPdf', matchedT.ID);
      if (res && res.dataUri) {
        const link = document.createElement('a');
        link.href = res.dataUri;
        link.download = res.fileName || 'Training_Report.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('PDF downloaded successfully!', 'success');
      } else if (res && res.pdfUrl) {
        window.open(res.pdfUrl, '_blank');
        showToast('PDF created in Google Drive!', 'success');
      }
    } catch(e) {
      showToast('PDF export error: ' + e.message, 'error');
    }
  }
</script>
