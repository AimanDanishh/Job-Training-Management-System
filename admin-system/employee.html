<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apollo - Employees</title>
  <?!= include('style') ?>
  <?!= include('script') ?>
</head>
<body>
<div id="__trainhub_config__" style="display:none" data-config="<?!= encodeURIComponent(JSON.stringify({ page: currentPage || '', publicPortalUrl: (typeof publicPortalUrl !== 'undefined' && publicPortalUrl) ? publicPortalUrl : '', companyLogoUrl: (typeof companyLogoUrl !== 'undefined' && companyLogoUrl) ? companyLogoUrl : '' })) ?>"></div>
<div class="app-shell">
  <!-- Sidebar -->
  <?!= include('sidebar') ?>

  <div class="main-area">
    <header class="topbar">
      <div style="flex:1"><h1 class="topbar-title">Employees</h1><p class="topbar-sub">Employee directory and records (Read-Only)</p></div>
    </header>

    <main class="page-content">
      <!-- Toolbar -->
      <div class="d-flex gap-2 flex-wrap justify-content-between align-items-center mb-3">
        <div style="display:flex;gap:8px">
          <div style="position:relative">
            <label for="search-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Search employees</label>
            <span class="icon" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:14px" aria-hidden="true">search</span>
            <input id="search-input" class="input-th" style="padding-left:28px;width:220px" placeholder="Search employees..." aria-label="Search employees">
          </div>
          <label for="dept-filter" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Filter by Department</label>
          <select id="dept-filter" class="input-th" style="width:auto" aria-label="Filter by Department">
            <option value="">All Departments</option>
            <option>Engineering</option><option>HR</option><option>Finance</option>
            <option>Operations</option><option>IT</option><option>Sales</option>
          </select>
          <label for="status-filter" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Filter by Status</label>
          <select id="status-filter" class="input-th" style="width:auto" aria-label="Filter by Status">
            <option value="">All Status</option>
            <option>Active</option><option>Inactive</option>
          </select>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-th btn-secondary btn-sm" onclick="loadEmployees()"><span class="icon sm">refresh</span>Refresh</button>
        </div>
      </div>

      <!-- Table -->
      <div class="card-th card-th-p0">
        <div style="overflow-x:auto">
          <table class="table-th">
            <thead><tr>
              <th>Employee ID</th><th>Name</th><th>Department</th><th>Position</th>
              <th>Email</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody id="emp-tbody">
              <tr><td colspan="7" style="text-align:center;color:#94A3B8;padding:40px">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="emp-footer" class="p-3" style="font-size:12px;color:#94A3B8;border-top:1px solid #F1F5F9"></div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="modal-add" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <div><h3 class="modal-title" id="modal-title">Add Employee</h3><p class="modal-sub">Fill in the details below</p></div>
      <button class="modal-close" onclick="closeModal('modal-add')"><span class="icon sm">close</span></button>
    </div>
    <input type="hidden" id="emp-id">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="emp-name" class="label-th">Full Name <span class="required">*</span></label>
        <input id="emp-name" class="input-th" placeholder="Full name">
      </div>
      <div class="col-md-6">
        <label for="emp-dept" class="label-th">Department <span class="required">*</span></label>
        <select id="emp-dept" class="input-th">
          <option value="">Select department</option>
          <option>Engineering</option><option>HR</option><option>Finance</option>
          <option>Operations</option><option>IT</option><option>Sales</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="emp-position" class="label-th">Position</label>
        <input id="emp-position" class="input-th" placeholder="Job title">
      </div>
      <div class="col-md-6">
        <label for="emp-status" class="label-th">Status</label>
        <select id="emp-status" class="input-th">
          <option>Active</option><option>Inactive</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="emp-email" class="label-th">Email</label>
        <input id="emp-email" class="input-th" type="email" placeholder="email@company.com">
      </div>
      <div class="col-md-6">
        <label for="emp-phone" class="label-th">Phone</label>
        <input id="emp-phone" class="input-th" placeholder="+60 1X-XXXXXXXX">
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #F1F5F9">
      <button class="btn-th btn-secondary" onclick="closeModal('modal-add')">Cancel</button>
      <button id="btn-save-emp" class="btn-th btn-primary" onclick="saveEmployee()"><span class="icon sm">save</span>Save Employee</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script>
  let allEmployees = [];

  onReady(() => {
    loadEmployees();
    const sInput = document.getElementById('search-input');
    const dFilter = document.getElementById('dept-filter');
    const stFilter = document.getElementById('status-filter');
    if (sInput) sInput.addEventListener('input', filterTable);
    if (dFilter) dFilter.addEventListener('change', filterTable);
    if (stFilter) stFilter.addEventListener('change', filterTable);
  });

  async function loadEmployees() {
    try {
      allEmployees = await callServer('getEmployees');
      renderTable(allEmployees);
    } catch(e) {
      showToast('Failed to load employees: ' + e.message, 'error');
    }
  }

  function filterTable() {
    const q    = document.getElementById('search-input').value.toLowerCase();
    const dept = document.getElementById('dept-filter').value;
    const stat = document.getElementById('status-filter').value;
    const f = allEmployees.filter(e =>
      (!q || String(e.Name||'').toLowerCase().includes(q) || String(e.ID||'').toLowerCase().includes(q) || String(e.Position||'').toLowerCase().includes(q)) &&
      (!dept || e.Department === dept) &&
      (!stat || e.Status === stat)
    );
    renderTable(f);
  }

  function renderTable(list) {
    const tbody = document.getElementById('emp-tbody');
    document.getElementById('emp-footer').textContent = `Showing ${list.length} of ${allEmployees.length} employees`;

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><span class="icon">group</span><p style="color:#94A3B8">No employees found</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = list.map((e, i) => `
      <tr>
        <td style="font-family:monospace;font-size:11px;color:#94A3B8">${e.ID}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            ${avatar(e.Name, 28, i)}
            <div>
              <div style="font-size:13px;font-weight:500">${e.Name}</div>
              <div style="font-size:11px;color:#94A3B8">${e.Position || ''}</div>
            </div>
          </div>
        </td>
        <td style="font-size:12px;color:#64748B">${e.Department}</td>
        <td style="font-size:12px;color:#64748B">${e.Position || '-'}</td>
        <td style="font-size:12px;color:#64748B">${e.Email || '-'}</td>
        <td>${statusBadge(e.Status || 'Active')}</td>
        <td>
          <div style="display:flex;gap:4px">
            <button class="btn-th btn-secondary btn-xs" onclick="editEmployee('${e.ID}')" title="Edit"><span class="icon sm">edit</span></button>
            <button class="btn-th btn-danger btn-xs" onclick="confirmDelete('${e.ID}')" title="Delete"><span class="icon sm">delete</span></button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function editEmployee(idOrObj) {
    const e = typeof idOrObj === 'object' ? idOrObj : allEmployees.find(x => x.ID === idOrObj);
    if (!e) return;
    document.getElementById('modal-title').textContent = 'Edit Employee';
    document.getElementById('emp-id').value       = e.ID;
    document.getElementById('emp-name').value     = e.Name;
    document.getElementById('emp-dept').value     = e.Department;
    document.getElementById('emp-position').value = e.Position;
    document.getElementById('emp-status').value   = e.Status;
    document.getElementById('emp-email').value    = e.Email;
    document.getElementById('emp-phone').value    = e.Phone;
    openModal('modal-add');
  }

  async function saveEmployee() {
    const id   = document.getElementById('emp-id').value;
    const name = document.getElementById('emp-name').value.trim();
    const dept = document.getElementById('emp-dept').value;
    if (!name) { showToast('Name is required.', 'error'); return; }
    if (!dept) { showToast('Department is required.', 'error'); return; }

    const data = {
      ID: id, Name: name, Department: dept,
      Position: document.getElementById('emp-position').value,
      Status:   document.getElementById('emp-status').value,
      Email:    document.getElementById('emp-email').value,
      Phone:    document.getElementById('emp-phone').value
    };

    const btn = document.getElementById('btn-save-emp');
    setBtnLoading(btn, true, 'Saving...');
    try {
      await callServer(id ? 'updateEmployee' : 'addEmployee', data);
      showToast(id ? 'Employee updated.' : 'Employee added.', 'success');
      closeModal('modal-add');
      clearForm();
      loadEmployees();
    } catch(e) {
      showToast(e.message, 'error');
    } finally {
      setBtnLoading(btn, false, '<span class="icon sm">save</span> Save Employee');
    }
  }

  async function confirmDelete(id) {
    if (!confirm('Delete this employee? This action cannot be undone.')) return;
    try {
      await callServer('deleteEmployee', id);
      showToast('Employee deleted.', 'success');
      loadEmployees();
    } catch(e) { showToast(e.message, 'error'); }
  }

  function clearForm() {
    ['emp-id','emp-name','emp-position','emp-email','emp-phone'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('emp-dept').value   = '';
    document.getElementById('emp-status').value = 'Active';
    document.getElementById('modal-title').textContent = 'Add Employee';
  }
</script>
</body>
</html>
