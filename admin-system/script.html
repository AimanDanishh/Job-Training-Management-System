<script>

// ─── Global Loading Screen & Animation Overlay ──────────────────────────────
let _activeLoadersCount = 0;
let _loaderTimeout = null;

function showLoadingOverlay(message = 'Processing request...') {
  _activeLoadersCount++;
  let el = document.getElementById('global-loading-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'global-loading-overlay';
    el.className = 'global-loading-overlay';
    el.innerHTML = `
      <div class="loading-card">
        <div class="spinner" style="width:36px;height:36px;border-width:3px;border-top-color:#2563EB;margin:0 auto 12px"></div>
        <div id="loading-msg-text" style="font-size:13.5px;font-weight:600;color:#1E293B">Loading...</div>
        <div style="font-size:11.5px;color:#64748B;margin-top:4px">Please wait a moment</div>
      </div>
    `;
    document.body.appendChild(el);
  }
  document.getElementById('loading-msg-text').textContent = message;
  el.classList.add('active');
}

function hideLoadingOverlay() {
  _activeLoadersCount = Math.max(0, _activeLoadersCount - 1);
  if (_activeLoadersCount === 0) {
    const el = document.getElementById('global-loading-overlay');
    if (el) el.classList.remove('active');
  }
}

// ─── google.script.run wrapper (returns a Promise) ───────────────────────────
function callServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    let loaderTimer = setTimeout(() => {
      showLoadingOverlay('Communicating with server...');
    }, 400);

    const cleanup = () => {
      clearTimeout(loaderTimer);
      hideLoadingOverlay();
    };

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      cleanup();
      reject(new Error('Google Apps Script runtime environment not detected.'));
      return;
    }

    const runner = google.script.run
      .withSuccessHandler(raw => {
        cleanup();
        try {
          const res = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (res && res.success === false) reject(new Error(res.message || 'Server error'));
          else resolve(res && res.data !== undefined ? res.data : res);
        } catch(e) { reject(e); }
      })
      .withFailureHandler(e => {
        cleanup();
        reject(new Error(e.message || String(e)));
      });

    try {
      if (typeof runner[fnName] !== 'function') {
        cleanup();
        reject(new Error(`Server function '${fnName}' does not exist on google.script.run.`));
        return;
      }
      runner[fnName](...args);
    } catch(e) {
      cleanup();
      reject(e);
    }
  });
}

// ─── Toast notifications ─────────────────────────────────────────────────────
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast-msg toast-' + type;
  const icons = { success: 'check_circle', error: 'error', info: 'info' };
  t.innerHTML = `<span class="icon filled sm">${icons[type] || 'info'}</span>${message}`;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s';
    setTimeout(() => t.remove(), 300); }, 3500);
}

// ─── Button loading state ────────────────────────────────────────────────────
function setBtnLoading(btn, loading, text) {
  if (loading) {
    btn.dataset.origText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> ' + (text || 'Loading...');
    btn.disabled = true;
  } else {
    btn.innerHTML = btn.dataset.origText || text || 'Submit';
    btn.disabled = false;
  }
}

// ─── Cross-Origin Safe Query Param Reader ──────────────────────────────────
function getQueryParam(name) {
  try {
    if (window.location && window.location.search) {
      const v = new URLSearchParams(window.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.top && window.top !== window && window.top.location) {
      const v = new URLSearchParams(window.top.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      const v = new URLSearchParams(window.parent.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  return null;
}

// ─── Navigate to page ────────────────────────────────────────────────────────
let _cachedBaseUrl = null;
function navTo(page, params) {
  const navigate = (base) => {
    if (!base) return;
    const cleanBase = String(base || '').split('?')[0];
    let url = cleanBase + '?page=' + page;
    if (params) Object.entries(params).forEach(([k,v]) => url += '&' + k + '=' + encodeURIComponent(v));
    try {
      if (window.top) window.top.location.href = url;
      else window.location.href = url;
    } catch(e) {
      window.location.href = url;
    }
  };
  if (_cachedBaseUrl) {
    navigate(_cachedBaseUrl);
    return;
  }
  const currentUrl = String(window.location.href || '').split('?')[0];
  if (currentUrl && currentUrl.includes('/exec')) {
    _cachedBaseUrl = currentUrl;
    navigate(currentUrl);
    return;
  }
  google.script.run.withSuccessHandler(base => {
    _cachedBaseUrl = base;
    navigate(base);
  }).getAppUrl();
}

// ─── Modal helpers ───────────────────────────────────────────────────────────

// ─── Status badge helper ─────────────────────────────────────────────────────
function statusBadge(status) {
  const map = {
    'Active':           'badge-green',   'In Progress':       'badge-blue',
    'Upcoming':         'badge-yellow',  'Completed':         'badge-green',
    'On going':         'badge-blue',    'On planning':       'badge-purple',
    'Draft':            'badge-gray',    'Archived':          'badge-gray',
    'Present':          'badge-green',   'Absent':            'badge-red',
    'Late':             'badge-yellow',  'Partial Attendance':'badge-yellow',
    'Left Early':       'badge-yellow',  'Pending':           'badge-yellow',
    'Pending Approval': 'badge-yellow',  'Approved':          'badge-green',
    'Rejected':         'badge-red',     'Postponed':         'badge-yellow',
    'Rescheduled':      'badge-yellow',  'Cancelled':         'badge-red',
    'Not Submitted':    'badge-gray',    'Inactive':          'badge-gray',
  };
  const cls = map[status] || 'badge-gray';
  return `<span class="badge-th ${cls}">${status}</span>`;
}

// ─── Automated Approval Status Badge ───────────────────────────────────────────
function approvalStatusBadge(status) {
  const s = String(status || '').trim();
  if (s.toLowerCase().includes('return')) {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D"><span class="icon sm" style="font-size:13px">undo</span>Returned</span>`;
  }
  if (!s || s === 'Approved' || s === 'Auto-Approved' || s === 'Fully Approved') {
    return `<span class="badge-th badge-green" style="display:inline-flex;align-items:center;gap:4px"><span class="icon sm" style="font-size:13px">check_circle</span>Approved</span>`;
  }
  if (s === 'Pending HOD Approval') {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D"><span class="icon sm" style="font-size:13px">hourglass_empty</span>Needs HOD Approval</span>`;
  }
  if (s === 'Pending C-Suite Approval') {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FFEDD5;color:#9A3412;border:1px solid #FDBA74"><span class="icon sm" style="font-size:13px">gavel</span>Needs C-Suite Approval</span>`;
  }
  if (s === 'Pending HOHR Approval') {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FDE68A;color:#78350F;border:1px solid #F59E0B"><span class="icon sm" style="font-size:13px">badge</span>Needs HOHR Approval</span>`;
  }
  if (s === 'Rejected') {
    return `<span class="badge-th badge-red" style="display:inline-flex;align-items:center;gap:4px"><span class="icon sm" style="font-size:13px">cancel</span>Rejected</span>`;
  }
  return `<span class="badge-th badge-yellow">${s}</span>`;
}

function isTrainingApproved(training) {
  if (!training) return false;
  const s = String(training.ApprovalStatus || '').trim().toLowerCase();
  if (s.includes('return') || s.includes('reject')) return false;
  if (!s || s === 'approved' || s === 'auto-approved' || s === 'fully approved') return true;
  return false;
}

function getApprovalRoleText(status) {
  const s = String(status || '').trim();
  if (s.includes('return')) return 'Resubmission / Approval';
  if (s === 'Pending HOD Approval') return 'HOD';
  if (s === 'Pending C-Suite Approval') return 'C-Suite';
  if (s === 'Pending HOHR Approval') return 'HOHR';
  if (s === 'Rejected') return 'Manager (Rejected)';
  return 'HOD / C-Suite / HOHR';
}

function formatMinimalistDate(dateVal) {
  if (!dateVal) return '';
  const str = String(dateVal).trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
  const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmyMatch) return `${dmyMatch[1].padStart(2, '0')}/${dmyMatch[2].padStart(2, '0')}/${dmyMatch[3]}`;
  const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (ymdMatch) return `${ymdMatch[3].padStart(2, '0')}/${ymdMatch[2].padStart(2, '0')}/${ymdMatch[1]}`;
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
  }
  return str.split('T')[0];
}

function formatMinimalistDateTime(dateVal) {
  if (!dateVal) return '';
  const str = String(dateVal).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${day}/${month}/${year} ${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
  }
  return str;
}


// ─── Lifecycle Timeline ──────────────────────────────────────────────────────
const LIFECYCLE_STAGES = [
  { id: 'created',      label: 'Created',                   icon: 'add_circle' },
  { id: 'participants', label: 'Participants\nImported',     icon: 'group_add' },
  { id: 'attendance',   label: 'Attendance\nIn Progress',   icon: 'fact_check' },
  { id: 'completed',    label: 'Training\nCompleted',        icon: 'task_alt' },
  { id: 'evaluation',   label: 'Evaluation\nCompleted',      icon: 'rate_review' },
  { id: 'threemonth',   label: 'Waiting for\n3-Month Review',icon: 'schedule' },
  { id: 'closed',       label: 'Programme\nClosed',          icon: 'verified' }
];
const STAGE_INDEX = {
  'Created': 0,
  'Participants Imported': 1,
  'Attendance In Progress': 2,
  'Training Completed': 3,
  'Evaluation Completed': 4,
  'Waiting for 3-Month Review': 5,
  'Waiting for 6-Month Review': 5,
  'Programme Closed': 6
};

function renderLifecycle(currentStage) {
  const current = STAGE_INDEX[currentStage] ?? 0;
  return '<div class="lifecycle">' + LIFECYCLE_STAGES.map((s, i) => {
    const cls = i < current ? 'done' : i === current ? 'current' : '';
    const icon = i < current ? 'check' : s.icon;
    return `<div class="lc-step ${cls}">
      <div class="lc-dot"><span class="icon sm">${icon}</span></div>
      <div class="lc-label">${s.label.replace('\n', '<br>')}</div>
    </div>`;
  }).join('') + '</div>';
}

// ─── Progress bar ─────────────────────────────────────────────────────────────
function progressBar(pct, color = '#2563EB', height = 7) {
  return `<div class="progress-th" style="height:${height}px">
    <div class="progress-bar-th" style="width:${pct}%;background:${color}"></div>
  </div>`;
}

// ─── Avatar ────────────────────────────────────────────────────────────────────
const AVATAR_COLORS = ['#2563EB','#7C3AED','#0891B2','#059669','#D97706','#DC2626','#DB2777'];
function avatar(name, size = 30, index = 0) {
  const safeName = String(name || '').trim();
  const initials = safeName ? safeName.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase() : '?';
  const bg = AVATAR_COLORS[index % AVATAR_COLORS.length];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg};font-size:${size*0.38}px">${initials}</div>`;
}

// ─── Sidebar minimizable collapse & real profile helpers ─────────────────────
function toggleSidebarCollapse() {
  const sidebar = document.querySelector('.sidebar');
  const mainArea = document.querySelector('.main-area');
  const collapseIcon = document.getElementById('sidebar-collapse-icon');
  
  if (!sidebar) return;
  const isCollapsed = sidebar.classList.toggle('collapsed');
  if (mainArea) mainArea.classList.toggle('sidebar-collapsed', isCollapsed);
  
  if (collapseIcon) {
    collapseIcon.textContent = isCollapsed ? 'chevron_right' : 'chevron_left';
  }
  
  try {
    localStorage.setItem('trainhub_sidebar_collapsed', isCollapsed ? 'true' : 'false');
  } catch(e) {}
}

function initSidebarState() {
  try {
    const saved = localStorage.getItem('trainhub_sidebar_collapsed');
    if (saved === 'true') {
      const sidebar = document.querySelector('.sidebar');
      const mainArea = document.querySelector('.main-area');
      const collapseIcon = document.getElementById('sidebar-collapse-icon');
      if (sidebar) sidebar.classList.add('collapsed');
      if (mainArea) mainArea.classList.add('sidebar-collapsed');
      if (collapseIcon) collapseIcon.textContent = 'chevron_right';
    }
  } catch(e) {}
}

function loadRealUserProfile() {
  callServer('getCurrentUser').then(user => {
    if (user && user.email) {
      const nameEl = document.getElementById('sidebar-user-name');
      const emailEl = document.getElementById('sidebar-user-email');
      const avatarEl = document.getElementById('sidebar-user-avatar');
      
      const emailStr = user.email;
      let nameStr = user.name;
      if (!nameStr) {
        const localPart = emailStr.split('@')[0] || 'User';
        nameStr = localPart.replace(/[\._\-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }
      
      if (nameEl) nameEl.textContent = nameStr;
      if (emailEl) emailEl.textContent = emailStr;
      
      if (avatarEl) {
        const initials = nameStr.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'AD';
        avatarEl.textContent = initials;
        avatarEl.title = `${nameStr} (${emailStr})`;
      }
    }
  }).catch(() => {});
}

// ─── Sidebar active state & navigation ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initSidebarState();
  loadRealUserProfile();

  const urlPage = getQueryParam('page');
  const page = window.__TRAINHUB_PAGE__ || urlPage || 'dashboard';
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    if (el.dataset.page === page) el.classList.add('active');
    else el.classList.remove('active');
    el.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-item[data-page]').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      const p = el.dataset.page;
      if (p) navTo(p);
    });
  });

  // Mobile sidebar toggle
  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar   = document.querySelector('.sidebar');
  if (toggleBtn && sidebar) {
    toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  }
});
</script>
