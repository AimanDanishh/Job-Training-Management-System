<script>
// Bootstrap's CSS is used for layout utilities; its JavaScript bundle is not
// required by this app. Keeping it out avoids Apps Script's document.write
// parser corrupting the external script URL during page rendering.
// ═══════════════════════════════════════════════════════════════════════════════
// Shared Utilities
// ═══════════════════════════════════════════════════════════════════════════════

// ─── Global Loading Screen & Animation Overlay ──────────────────────────────
let _activeLoadersCount = 0;
let _loaderTimeout = null;

function showLoadingOverlay(message = 'Processing request...') {
  _activeLoadersCount++;
  let el = document.getElementById('global-loading-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'global-loading-overlay';
    el.className = 'global-loading-overlay';
    el.innerHTML = `
      <div class="loading-card">
        <div class="spinner" style="width:36px;height:36px;border-width:3px;border-top-color:#2563EB;margin:0 auto 12px"></div>
        <div id="loading-msg-text" style="font-size:13.5px;font-weight:600;color:#1E293B">Loading...</div>
        <div style="font-size:11.5px;color:#64748B;margin-top:4px">Please wait a moment</div>
      </div>
    `;
    document.body.appendChild(el);
  }
  document.getElementById('loading-msg-text').textContent = message;
  el.classList.add('active');
}

function hideLoadingOverlay() {
  _activeLoadersCount = Math.max(0, _activeLoadersCount - 1);
  if (_activeLoadersCount === 0) {
    const el = document.getElementById('global-loading-overlay');
    if (el) el.classList.remove('active');
  }
}

// ─── google.script.run wrapper (returns a Promise) ───────────────────────────
function callServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    let loaderTimer = setTimeout(() => {
      showLoadingOverlay('Communicating with server...');
    }, 400);

    const cleanup = () => {
      clearTimeout(loaderTimer);
      hideLoadingOverlay();
    };

    const runner = google.script.run
      .withSuccessHandler(raw => {
        cleanup();
        try {
          const res = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (res && res.success === false) reject(new Error(res.message || 'Server error'));
          else resolve(res && res.data !== undefined ? res.data : res);
        } catch(e) { reject(e); }
      })
      .withFailureHandler(e => {
        cleanup();
        reject(new Error(e.message || String(e)));
      });
    runner[fnName](...args);
  });
}

// ─── Toast notifications ─────────────────────────────────────────────────────
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast-msg toast-' + type;
  const icons = { success: 'check_circle', error: 'error', info: 'info' };
  t.innerHTML = `<span class="icon filled sm">${icons[type] || 'info'}</span>${message}`;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s';
    setTimeout(() => t.remove(), 300); }, 3500);
}

// ─── Button loading state ────────────────────────────────────────────────────
function setBtnLoading(btn, loading, text) {
  if (loading) {
    btn.dataset.origText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> ' + (text || 'Loading...');
    btn.disabled = true;
  } else {
    btn.innerHTML = btn.dataset.origText || text || 'Submit';
    btn.disabled = false;
  }
}

// ─── Cross-Origin Safe Query Param Reader ──────────────────────────────────
function getQueryParam(name) {
  try {
    if (window.location && window.location.search) {
      const v = new URLSearchParams(window.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.top && window.top !== window && window.top.location) {
      const v = new URLSearchParams(window.top.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      const v = new URLSearchParams(window.parent.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  return null;
}

// ─── Navigate to page ────────────────────────────────────────────────────────
let _cachedBaseUrl = null;
function navTo(page, params) {
  const navigate = (base) => {
    if (!base) return;
    const cleanBase = base.split('?')[0];
    let url = cleanBase + '?page=' + page;
    if (params) Object.entries(params).forEach(([k,v]) => url += '&' + k + '=' + encodeURIComponent(v));
    try {
      if (window.top) window.top.location.href = url;
      else window.location.href = url;
    } catch(e) {
      window.location.href = url;
    }
  };
  if (_cachedBaseUrl) {
    navigate(_cachedBaseUrl);
    return;
  }
  const currentUrl = window.location.href.split('?')[0];
  if (currentUrl && currentUrl.includes('/exec')) {
    _cachedBaseUrl = currentUrl;
    navigate(currentUrl);
    return;
  }
  google.script.run.withSuccessHandler(base => {
    _cachedBaseUrl = base;
    navigate(base);
  }).getAppUrl();
}

// ─── Modal helpers ───────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// Close modal on overlay click
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.style.display = 'none';
  }
});

// ─── Status badge helper ─────────────────────────────────────────────────────
function statusBadge(status) {
  const map = {
    'Active':           'badge-green',   'In Progress':       'badge-blue',
    'Upcoming':         'badge-yellow',  'Completed':         'badge-green',
    'Draft':            'badge-gray',    'Archived':          'badge-gray',
    'Present':          'badge-green',   'Absent':            'badge-red',
    'Late':             'badge-yellow',  'Partial Attendance':'badge-yellow',
    'Left Early':       'badge-yellow',  'Pending':           'badge-yellow',
    'Not Submitted':    'badge-gray',    'Inactive':          'badge-gray',
  };
  const cls = map[status] || 'badge-gray';
  return `<span class="badge-th ${cls}">${status}</span>`;
}

// ─── Stage badge ─────────────────────────────────────────────────────────────
function stageBadge(stage) {
  return `<span class="badge-th badge-blue" style="white-space:nowrap">${stage}</span>`;
}

// ─── Lifecycle Timeline ──────────────────────────────────────────────────────
const LIFECYCLE_STAGES = [
  { id: 'created',      label: 'Created',                   icon: 'add_circle' },
  { id: 'participants', label: 'Participants\nImported',     icon: 'group_add' },
  { id: 'attendance',   label: 'Attendance\nIn Progress',   icon: 'fact_check' },
  { id: 'completed',    label: 'Training\nCompleted',        icon: 'task_alt' },
  { id: 'evaluation',   label: 'Evaluation\nCompleted',      icon: 'rate_review' },
  { id: 'sixmonth',     label: 'Waiting for\n6-Month Review',icon: 'schedule' },
  { id: 'closed',       label: 'Programme\nClosed',          icon: 'verified' }
];
const STAGE_INDEX = {
  'Created': 0, 'Participants Imported': 1, 'Attendance In Progress': 2,
  'Training Completed': 3, 'Evaluation Completed': 4,
  'Waiting for 6-Month Review': 5, 'Programme Closed': 6
};

function renderLifecycle(currentStage) {
  const current = STAGE_INDEX[currentStage] ?? 0;
  return '<div class="lifecycle">' + LIFECYCLE_STAGES.map((s, i) => {
    const cls = i < current ? 'done' : i === current ? 'current' : '';
    const icon = i < current ? 'check' : s.icon;
    return `<div class="lc-step ${cls}">
      <div class="lc-dot"><span class="icon sm">${icon}</span></div>
      <div class="lc-label">${s.label.replace('\n', '<br>')}</div>
    </div>`;
  }).join('') + '</div>';
}

// ─── Progress bar ─────────────────────────────────────────────────────────────
function progressBar(pct, color = '#2563EB', height = 7) {
  return `<div class="progress-th" style="height:${height}px">
    <div class="progress-bar-th" style="width:${pct}%;background:${color}"></div>
  </div>`;
}

// ─── Avatar ────────────────────────────────────────────────────────────────────
const AVATAR_COLORS = ['#2563EB','#7C3AED','#0891B2','#059669','#D97706','#DC2626','#DB2777'];
function avatar(name, size = 30, index = 0) {
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const bg = AVATAR_COLORS[index % AVATAR_COLORS.length];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg};font-size:${size*0.38}px">${initials}</div>`;
}

// ─── Sidebar active state & navigation ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const urlPage = getQueryParam('page');
  const page = window.__TRAINHUB_PAGE__ || urlPage || 'dashboard';
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    if (el.dataset.page === page) el.classList.add('active');
    else el.classList.remove('active');
    el.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-item[data-page]').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      const p = el.dataset.page;
      if (p) navTo(p);
    });
  });

  // Mobile sidebar toggle
  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar   = document.querySelector('.sidebar');
  if (toggleBtn && sidebar) {
    toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  }
});
</script>
