// --- Global Loading Screen & Animation Overlay ------------------------------
let _activeLoadersCount = 0;
let _loaderTimeout = null;

function showLoadingOverlay(message = 'Processing request...') {
  _activeLoadersCount++;
  let el = document.getElementById('global-loading-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'global-loading-overlay';
    el.className = 'global-loading-overlay';
    el.innerHTML = `
      <div class="loading-card">
        <div class="spinner" style="width:36px;height:36px;border-width:3.5px;border-top-color:#E91C2D;margin:0 auto 12px"></div>
        <div id="loading-msg-text" style="font-size:13.5px;font-weight:700;color:#111111">Loading...</div>
        <div style="font-size:11.5px;color:#64748B;margin-top:4px">Please wait a moment</div>
      </div>
    `;
    document.body.appendChild(el);
  }
  document.getElementById('loading-msg-text').textContent = message;
  el.classList.add('active');
}

function hideLoadingOverlay() {
  _activeLoadersCount = Math.max(0, _activeLoadersCount - 1);
  if (_activeLoadersCount === 0) {
    const el = document.getElementById('global-loading-overlay');
    if (el) el.classList.remove('active');
  }
}

// --- google.script.run wrapper (returns a Promise) ---------------------------
function callServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    let loaderTimer = setTimeout(() => {
      showLoadingOverlay('Communicating with server...');
    }, 400);

    const cleanup = () => {
      clearTimeout(loaderTimer);
      hideLoadingOverlay();
    };

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      cleanup();
      reject(new Error('Google Apps Script runtime environment not detected. Please run this web application from your deployed Apps Script URL.'));
      return;
    }

    const runner = google.script.run
      .withSuccessHandler(raw => {
        cleanup();
        try {
          const res = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (res && res.success === false) reject(new Error(res.message || 'Server error'));
          else resolve(res && res.data !== undefined ? res.data : res);
        } catch(e) { reject(e); }
      })
      .withFailureHandler(e => {
        cleanup();
        reject(new Error(e.message || String(e)));
      });

    try {
      if (typeof runner[fnName] !== 'function') {
        cleanup();
        reject(new Error(`Server function '${fnName}' does not exist on google.script.run.`));
        return;
      }
      runner[fnName](...args);
    } catch(e) {
      cleanup();
      reject(e);
    }
  });
}

// --- Toast notifications -----------------------------------------------------
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast-msg toast-' + type;
  const icons = { success: 'check_circle', error: 'error', info: 'info' };
  t.innerHTML = `<span class="icon filled sm">${icons[type] || 'info'}</span>${message}`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s ease';
    setTimeout(() => t.remove(), 300);
  }, 3500);
}

// --- Button loading state ----------------------------------------------------
function setBtnLoading(btn, loading, text) {
  if (!btn) return;
  if (loading) {
    btn.dataset.origText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> ' + (text || 'Loading...');
    btn.disabled = true;
  } else {
    btn.innerHTML = btn.dataset.origText || text || 'Submit';
    btn.disabled = false;
  }
}

// --- Cross-Origin Safe Query Param Reader ----------------------------------
function getQueryParam(name) {
  try {
    if (window.location && window.location.search) {
      const v = new URLSearchParams(window.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.top && window.top !== window && window.top.location) {
      const v = new URLSearchParams(window.top.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      const v = new URLSearchParams(window.parent.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  return null;
}

// --- Navigate to page --------------------------------------------------------
let _cachedBaseUrl = null;
function navTo(page, params) {
  // Clean up timers when navigating
  if (window.CountdownTimerManager) {
    window.CountdownTimerManager.stop();
  }
  const navigate = (base) => {
    if (!base) return;
    const cleanBase = String(base || '').split('?')[0];
    let url = cleanBase + '?page=' + page;
    if (params) Object.entries(params).forEach(([k,v]) => url += '&' + k + '=' + encodeURIComponent(v));

    try {
      window.open(url, '_top');
    } catch(e) {
      window.location.href = url;
    }
  };
  if (_cachedBaseUrl) {
    navigate(_cachedBaseUrl);
    return;
  }
  const currentUrl = String(window.location.href || '').split('?')[0];
  if (currentUrl && currentUrl.includes('/exec')) {
    _cachedBaseUrl = currentUrl;
    navigate(currentUrl);
    return;
  }
  google.script.run
    .withSuccessHandler(base => {
      _cachedBaseUrl = base;
      navigate(base);
    })
    .withFailureHandler(() => {
      navigate(currentUrl);
    })
    .getAppUrl();
}

function downloadQRWithLogo(attUrl, filename = 'Apollo_QR_Code.png') {
  const qrSrc = getQuickChartBaseUrl(attUrl);
  const logoSrc = getApolloLogoUrl();

  const canvas = document.createElement('canvas');
  canvas.width = 400;
  canvas.height = 400;
  const ctx = canvas.getContext('2d');

  const drawLogoOnCanvas = (targetLogoSrc) => {
    const logoImg = new Image();
    if (!targetLogoSrc.startsWith('data:')) logoImg.crossOrigin = 'Anonymous';
    logoImg.onload = () => {
      const lSize = 88;
      const x = (400 - lSize) / 2;
      const y = (400 - lSize) / 2;

      ctx.fillStyle = '#FFF8CF';
      ctx.strokeStyle = '#FEC30D';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x - 6, y - 6, lSize + 12, lSize + 12, 10);
      } else {
        ctx.fillRect(x - 6, y - 6, lSize + 12, lSize + 12);
      }
      ctx.fill();
      ctx.stroke();

      ctx.drawImage(logoImg, x, y, lSize, lSize);

      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    };
    logoImg.onerror = () => {
      if (targetLogoSrc !== DEFAULT_FALLBACK_LOGO) {
        drawLogoOnCanvas(DEFAULT_FALLBACK_LOGO);
      } else {
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    };
    logoImg.src = targetLogoSrc;
  };

  const qrImg = new Image();
  qrImg.crossOrigin = 'Anonymous';
  qrImg.onload = () => {
    ctx.drawImage(qrImg, 0, 0, 400, 400);
    drawLogoOnCanvas(logoSrc);
  };
  qrImg.onerror = () => {
    window.open(qrSrc, '_blank');
  };
  qrImg.src = qrSrc;
}

// ===============================================================================
// Real-Time Time-Aware Training Status & Evaluation Countdown Engine
// ===============================================================================

const ApolloCountdown = {
  parseDateSafely(val) {
    if (!val) return null;
    if (val instanceof Date) {
      return !isNaN(val.getTime()) ? new Date(val.getFullYear(), val.getMonth(), val.getDate()) : null;
    }
    const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
    if (!str) return null;
    const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (ymdMatch) {
      return new Date(parseInt(ymdMatch[1], 10), parseInt(ymdMatch[2], 10) - 1, parseInt(ymdMatch[3], 10));
    }
    const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (dmyMatch) {
      return new Date(parseInt(dmyMatch[3], 10), parseInt(dmyMatch[2], 10) - 1, parseInt(dmyMatch[1], 10));
    }
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    return null;
  },

  calculate2WeekDeadline(completionDate) {
    const d = this.parseDateSafely(completionDate);
    if (!d) return null;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 14, 23, 59, 59, 999);
  },

  calculate3MonthDeadline(completionDate) {
    const d = this.parseDateSafely(completionDate);
    if (!d) return null;
    const y = d.getFullYear();
    const m = d.getMonth() + 3;
    const day = d.getDate();
    const targetY = y + Math.floor(m / 12);
    const targetM = m % 12;
    const daysInTargetMonth = new Date(targetY, targetM + 1, 0).getDate();
    const targetDay = Math.min(day, daysInTargetMonth);
    return new Date(targetY, targetM, targetDay, 23, 59, 59, 999);
  },

  getStatus(completionDateInput, deadlineType = '2week', isCompleted = false, isWaiting = false) {
    const is3Mo = deadlineType === '3month';
    const typeLabel = is3Mo ? 'Supervisor Evaluation' : 'Training Evaluation';

    if (isCompleted) {
      return {
        status: 'completed',
        label: `${typeLabel} Completed`,
        badgeText: 'Completed',
        shortText: 'Completed',
        detail: `${typeLabel} is complete`,
        isCompleted: true,
        daysDiff: 0
      };
    }

    if (isWaiting || !completionDateInput) {
      return {
        status: 'waiting',
        label: 'Waiting for Training Completion',
        badgeText: 'Waiting for Completion',
        shortText: 'Waiting',
        detail: 'Countdowns start once training is completed',
        isWaiting: true,
        daysDiff: 0
      };
    }

    const completionDate = this.parseDateSafely(completionDateInput);
    if (!completionDate) {
      return {
        status: 'waiting',
        label: 'Waiting for Training Completion',
        badgeText: 'Waiting for Completion',
        shortText: 'Waiting',
        detail: 'No valid completion date found',
        isWaiting: true,
        daysDiff: 0
      };
    }

    const deadline = is3Mo ? this.calculate3MonthDeadline(completionDate) : this.calculate2WeekDeadline(completionDate);
    if (!deadline) {
      return {
        status: 'waiting',
        label: 'Waiting for Training Completion',
        badgeText: 'Waiting for Completion',
        shortText: 'Waiting',
        detail: 'No deadline calculated',
        isWaiting: true,
        daysDiff: 0
      };
    }

    const now = new Date();
    const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const deadlineMidnight = new Date(deadline.getFullYear(), deadline.getMonth(), deadline.getDate());

    const diffDays = Math.round((deadlineMidnight.getTime() - nowMidnight.getTime()) / (1000 * 60 * 60 * 24));
    const compStr = formatMinimalistDate(completionDate);
    const deadStr = formatMinimalistDate(deadline);

    if (diffDays < 0) {
      const overdueDays = Math.abs(diffDays);
      const dayText = overdueDays === 1 ? '1 day' : `${overdueDays} days`;
      return {
        status: 'overdue',
        label: `${typeLabel} Overdue (${dayText} overdue)`,
        badgeText: `Overdue by ${dayText}`,
        shortText: `Overdue by ${dayText}`,
        detail: `Deadline was ${deadStr}`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: diffDays,
        deadlineDate: deadline,
        completionDate: completionDate,
        isOverdue: true
      };
    }

    if (diffDays === 0) {
      return {
        status: 'today',
        label: 'Due Today',
        badgeText: 'Due Today',
        shortText: 'Due Today',
        detail: `Deadline is today (${deadStr})`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: 0,
        deadlineDate: deadline,
        completionDate: completionDate,
        isDueToday: true
      };
    }

    if (diffDays === 1) {
      return {
        status: 'approaching',
        label: 'Due Tomorrow',
        badgeText: 'Due Tomorrow',
        shortText: 'Due Tomorrow',
        detail: `Deadline: ${deadStr}`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: 1,
        deadlineDate: deadline,
        completionDate: completionDate,
        isApproaching: true
      };
    }

    if (diffDays <= 14) {
      const isApproaching = diffDays <= 5;
      const text = (diffDays === 14 && !is3Mo) ? 'Due in 2 weeks' : `Due in ${diffDays} days`;
      return {
        status: isApproaching ? 'approaching' : 'normal',
        label: text,
        badgeText: text,
        shortText: text,
        detail: `Deadline: ${deadStr}`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: diffDays,
        deadlineDate: deadline,
        completionDate: completionDate,
        isApproaching: isApproaching
      };
    }

    const months = Math.max(1, Math.round(diffDays / 30.43));
    const monthText = months === 1 ? '1 month' : `${months} months`;
    const labelText = `Due in ${monthText}`;

    return {
      status: 'normal',
      label: labelText,
      badgeText: labelText,
      shortText: labelText,
      detail: `Deadline: ${deadStr}`,
      completionDateStr: compStr,
      deadlineDateStr: deadStr,
      daysDiff: diffDays,
      deadlineDate: deadline,
      completionDate: completionDate
    };
  },

  renderBadge(statusObj) {
    if (!statusObj) return '';
    const icons = {
      completed: 'check_circle',
      overdue: 'cancel',
      today: 'warning',
      approaching: 'schedule',
      normal: 'schedule',
      waiting: 'hourglass_empty'
    };
    const icon = icons[statusObj.status] || 'schedule';
    return `<span class="countdown-badge cd-${statusObj.status}"><span class="icon sm filled">${icon}</span><span>${statusObj.badgeText || statusObj.label}</span></span>`;
  },

  renderWidget(statusObj, title = 'Evaluation Timeline') {
    if (!statusObj) return '';
    const isCompleted = statusObj.status === 'completed';
    const isOverdue = statusObj.status === 'overdue';
    const isToday = statusObj.status === 'today';
    const isWaiting = statusObj.status === 'waiting';

    let headerBg = '#F8FAFC';
    let borderColor = '#E2E8F0';
    if (isCompleted) { headerBg = '#F0FDF4'; borderColor = '#BBF7D0'; }
    else if (isOverdue) { headerBg = '#FEF2F2'; borderColor = '#FECACA'; }
    else if (isToday) { headerBg = '#FFF8CF'; borderColor = '#FEC30D'; }
    else if (statusObj.status === 'approaching') { headerBg = '#FFFBEB'; borderColor = '#FDE68A'; }

    return `
      <div class="card-th" style="background:${headerBg};border:1.5px solid ${borderColor};padding:18px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px">
          <div>
            <div style="font-size:14px;font-weight:800;color:var(--apollo-dark);display:flex;align-items:center;gap:6px">
              <span class="icon" style="color:${isCompleted ? '#16A34A' : isOverdue ? '#E91C2D' : '#FEC30D'}">timer</span>
              ${title}
            </div>
            <div style="font-size:12px;color:var(--apollo-gray-600);margin-top:2px">${statusObj.detail || ''}</div>
          </div>
          <div>
            ${this.renderBadge(statusObj)}
          </div>
        </div>
        ${!isWaiting ? `
          <div class="row g-2" style="font-size:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.06)">
            <div class="col-6 col-md-4">
              <span style="color:var(--apollo-gray-500)">Training Completed:</span>
              <strong style="color:var(--apollo-dark);display:block">${statusObj.completionDateStr || '-'}</strong>
            </div>
            <div class="col-6 col-md-4">
              <span style="color:var(--apollo-gray-500)">Target Deadline:</span>
              <strong style="color:var(--apollo-dark);display:block">${statusObj.deadlineDateStr || '-'}</strong>
            </div>
            <div class="col-12 col-md-4">
              <span style="color:var(--apollo-gray-500)">Current Status:</span>
              <strong style="color:${isCompleted ? '#16A34A' : isOverdue ? '#E91C2D' : '#111111'};display:block">${statusObj.label}</strong>
            </div>
          </div>
        ` : `
          <div style="font-size:12px;color:var(--apollo-gray-500);padding-top:8px;border-top:1px dashed #CBD5E1">
            Training is currently in progress or not yet marked as completed. The post-training countdown will automatically begin on the training completion date.
          </div>
        `}
      </div>
    `;
  }
};

// --- Real-Time Countdown Timer Manager ---------------------------------------
const CountdownTimerManager = {
  _timer: null,
  _callbacks: new Map(),

  start() {
    if (this._timer) clearInterval(this._timer);
    this._timer = setInterval(() => this.tick(), 60000);
  },

  stop() {
    if (this._timer) {
      clearInterval(this._timer);
      this._timer = null;
    }
  },

  register(id, callback) {
    if (!id || typeof callback !== 'function') return;
    this._callbacks.set(id, callback);
    try { callback(); } catch(e) {}
  },

  unregister(id) {
    this._callbacks.delete(id);
  },

  tick() {
    this.refreshAll();
  },

  refreshAll() {
    this._callbacks.forEach(fn => {
      try { fn(); } catch(e) {}
    });

    document.querySelectorAll('[data-apollo-countdown]').forEach(el => {
      const completionDate = el.dataset.completionDate;
      const type = el.dataset.countdownType || '2week';
      const isCompleted = el.dataset.isCompleted === 'true';
      const isWaiting = el.dataset.isWaiting === 'true';
      const statusObj = ApolloCountdown.getStatus(completionDate, type, isCompleted, isWaiting);
      el.innerHTML = ApolloCountdown.renderBadge(statusObj);
    });
  }
};

function statusBadge(status) {
  const map = {
    'Active':           'badge-green',   'In Progress':       'badge-gold',
    'Upcoming':         'badge-yellow',  'Completed':         'badge-green',
    'On going':         'badge-gold',    'On planning':       'badge-purple',
    'Draft':            'badge-gray',    'Archived':          'badge-gray',
    'Present':          'badge-green',   'Absent':            'badge-red',
    'Late':             'badge-yellow',  'Partial Attendance':'badge-yellow',
    'Left Early':       'badge-yellow',  'Pending':           'badge-yellow',
    'Pending Approval': 'badge-yellow',  'Approved':          'badge-green',
    'Rejected':         'badge-red',     'Postponed':         'badge-yellow',
    'Rescheduled':      'badge-yellow',  'Cancelled':         'badge-red',
    'Not Submitted':    'badge-gray',    'Inactive':          'badge-gray',
  };
  const cls = map[status] || 'badge-gray';
  return `<span class="badge-th ${cls}">${status}</span>`;
}

function approvalStatusBadge(status) {
  const s = String(status || '').trim();
  if (s.toLowerCase().includes('return')) {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FFF8CF;color:#92400E;border:1px solid #FEC30D"><span class="icon sm" style="font-size:13px">undo</span>Returned</span>`;
  }
  if (!s || s === 'Approved' || s === 'Auto-Approved' || s === 'Fully Approved') {
    return `<span class="badge-th badge-green" style="display:inline-flex;align-items:center;gap:4px"><span class="icon sm" style="font-size:13px">check_circle</span>Approved</span>`;
  }
  if (s === 'Pending HOD Approval') {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FFFBEB;color:#92400E;border:1px solid #FCD34D"><span class="icon sm" style="font-size:13px">hourglass_empty</span>Needs HOD Approval</span>`;
  }
  if (s === 'Pending C-Suite Approval') {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FFEDD5;color:#9A3412;border:1px solid #FDBA74"><span class="icon sm" style="font-size:13px">gavel</span>Needs C-Suite Approval</span>`;
  }
  if (s === 'Pending HOHR Approval') {
    return `<span class="badge-th badge-yellow" style="display:inline-flex;align-items:center;gap:4px;background:#FFF8CF;color:#78350F;border:1px solid #FEC30D"><span class="icon sm" style="font-size:13px">badge</span>Needs HOHR Approval</span>`;
  }
  if (s === 'Rejected') {
    return `<span class="badge-th badge-red" style="display:inline-flex;align-items:center;gap:4px"><span class="icon sm" style="font-size:13px">cancel</span>Rejected</span>`;
  }
  return `<span class="badge-th badge-yellow">${s}</span>`;
}

function isTrainingApproved(training) {
  if (!training) return false;
  const s = String(training.ApprovalStatus || '').trim().toLowerCase();
  if (s.includes('return') || s.includes('reject')) return false;
  if (!s || s === 'approved' || s === 'auto-approved' || s === 'fully approved') return true;
  return false;
}

function getApprovalRoleText(status) {
  const s = String(status || '').trim();
  if (s.includes('return')) return 'Resubmission / Approval';
  if (s === 'Pending HOD Approval') return 'HOD';
  if (s === 'Pending C-Suite Approval') return 'C-Suite';
  if (s === 'Pending HOHR Approval') return 'HOHR';
  if (s === 'Rejected') return 'Manager (Rejected)';
  return 'HOD / C-Suite / HOHR';
}

function formatMinimalistDate(dateVal) {
  if (!dateVal) return '-';
  const str = String(dateVal).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
  const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmyMatch) return `${dmyMatch[1].padStart(2, '0')}/${dmyMatch[2].padStart(2, '0')}/${dmyMatch[3]}`;
  const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (ymdMatch) return `${ymdMatch[3].padStart(2, '0')}/${ymdMatch[2].padStart(2, '0')}/${ymdMatch[1]}`;
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
  }
  return str.split('T')[0] || '-';
}

function formatDisplayTime(val, defaultTime = '09:00 AM') {
  if (!val) return defaultTime;
  const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  
  const ampmMatch = str.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (ampmMatch && !str.includes('1899') && !str.includes('Singapore') && !str.includes('Standard') && !str.includes('GMT')) {
    let hh = parseInt(ampmMatch[1], 10);
    const mm = ampmMatch[2];
    const ampm = ampmMatch[3] ? ampmMatch[3].toUpperCase() : (hh >= 12 ? 'PM' : 'AM');
    if (hh > 12) hh = hh % 12;
    if (hh === 0) hh = 12;
    return `${String(hh).padStart(2, '0')}:${mm} ${ampm}`;
  }

  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
  }
  return defaultTime;
}

function formatSessionTimeRange(startVal, endVal) {
  const sTime = formatDisplayTime(startVal, '09:00 AM');
  const eTime = formatDisplayTime(endVal, '05:00 PM');
  return `${sTime} - ${eTime}`;
}

function formatMinimalistDateTime(dateVal) {
  if (!dateVal) return '';
  const str = String(dateVal).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${day}/${month}/${year} ${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
  }
  return str;
}

// --- Enhanced Lifecycle Timeline with Real-Time Countdowns ------------------
const LIFECYCLE_STAGES = [
  { id: 'created',      label: 'Training Requested',       icon: 'add_circle' },
  { id: 'participants', label: 'Approved & Participants',  icon: 'group_add' },
  { id: 'attendance',   label: 'Ongoing Attendance',       icon: 'fact_check' },
  { id: 'completed',    label: 'Training Completed',       icon: 'task_alt' },
  { id: 'evaluation',   label: 'Training Eval (2 Weeks)',  icon: 'rate_review', hasCountdown: '2week' },
  { id: 'supervisor',   label: 'Supervisor (3 Months)',    icon: 'schedule',    hasCountdown: '3month' },
  { id: 'closed',       label: 'Programme Closed',         icon: 'verified' }
];

const STAGE_INDEX = {
  'Created': 0,
  'Training Requested': 0,
  'Participants Imported': 1,
  'Approved': 1,
  'Attendance In Progress': 2,
  'Ongoing': 2,
  'Training Completed': 3,
  'Evaluation Completed': 4,
  'Training Evaluation': 4,
  'Post Evaluation': 4,
  'Waiting for 3-Month Review': 5,
  'Supervisor Evaluation': 5,
  'Programme Closed': 6,
  'Closed': 6
};

function renderLifecycle(currentStage, trainingObj) {
  const current = (typeof STAGE_INDEX[currentStage] === 'number') ? STAGE_INDEX[currentStage] : 0;
  const isCompleted = current >= 3;
  const compDate = trainingObj ? (trainingObj.EndDate || trainingObj.StartDate) : null;

  return '<div class="lifecycle">' + LIFECYCLE_STAGES.map((s, i) => {
    const isDone = i < current;
    const isCurr = i === current;
    const cls = isDone ? 'done' : isCurr ? 'current' : '';
    const icon = isDone ? 'check' : s.icon;

    let countdownChip = '';
    if (s.hasCountdown && isCompleted && compDate) {
      const isEvalDone = (s.hasCountdown === '2week' && current >= 4) || (s.hasCountdown === '3month' && current >= 6);
      const st = ApolloCountdown.getStatus(compDate, s.hasCountdown, isEvalDone, false);
      if (!isEvalDone) {
        countdownChip = `<div class="lc-badge cd-${st.status}" style="margin-top:4px;font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700">${st.shortText || st.badgeText}</div>`;
      }
    }

    return `<div class="lc-step ${cls}">
      <div class="lc-dot"><span class="icon sm">${icon}</span></div>
      <div class="lc-label">${s.label}</div>
      ${countdownChip}
    </div>`;
  }).join('') + '</div>';
}

const AVATAR_COLORS = ['#E91C2D','#FEC30D','#059669','#2563EB','#7C3AED','#D97706','#DC2626'];
function avatar(name, size = 32, index = 0) {
  const safeName = String(name || '').trim();
  const initials = safeName ? safeName.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase() : 'AD';
  const bg = AVATAR_COLORS[index % AVATAR_COLORS.length];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg};font-size:${size*0.38}px">${initials}</div>`;
}

// --- Sidebar Minimizable Collapse -------------------------------------------
function toggleSidebarCollapse() {
  const sidebar = document.querySelector('.sidebar');
  const mainArea = document.querySelector('.main-area');
  const collapseIcon = document.getElementById('sidebar-collapse-icon');
  
  if (!sidebar) return;
  const isCollapsed = sidebar.classList.toggle('collapsed');
  if (mainArea) mainArea.classList.toggle('sidebar-collapsed', isCollapsed);
  
  if (collapseIcon) {
    collapseIcon.textContent = isCollapsed ? 'chevron_right' : 'chevron_left';
  }
  
  try {
    localStorage.setItem('trainhub_sidebar_collapsed', isCollapsed ? 'true' : 'false');
  } catch(e) {}
}

function initSidebarState() {
  try {
    const saved = localStorage.getItem('trainhub_sidebar_collapsed');
    if (saved === 'true') {
      const sidebar = document.querySelector('.sidebar');
      const mainArea = document.querySelector('.main-area');
      const collapseIcon = document.getElementById('sidebar-collapse-icon');
      if (sidebar) sidebar.classList.add('collapsed');
      if (mainArea) mainArea.classList.add('sidebar-collapsed');
      if (collapseIcon) collapseIcon.textContent = 'chevron_right';
    }
  } catch(e) {}
}

// --- Real User Profile Loader ------------------------------------------------
function loadRealUserProfile() {
  callServer('getCurrentUser').then(user => {
    if (user && user.email) {
      const nameEl = document.getElementById('sidebar-user-name');
      const emailEl = document.getElementById('sidebar-user-email');
      const avatarEl = document.getElementById('sidebar-user-avatar');

      const emailStr = user.email;
      let nameStr = user.name;
      if (!nameStr) {
        const localPart = emailStr.split('@')[0] || 'User';
        nameStr = localPart.replace(/[\._\-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }

      if (nameEl) nameEl.textContent = nameStr;
      if (emailEl) emailEl.textContent = emailStr;

      if (avatarEl) {
        const initials = nameStr.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'AD';
        avatarEl.textContent = initials;
        avatarEl.title = `${nameStr} (${emailStr})`;
      }
    }
  }).catch(() => {});
}

function onReady(fn) {
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(fn, 0);
  } else {
    document.addEventListener('DOMContentLoaded', fn);
  }
}
window.onReady = onReady;

onReady(() => {
  initSidebarState();
  initSidebarLogo();
  loadRealUserProfile();
  CountdownTimerManager.start();

  const urlPage = getQueryParam('page');
  const page = window.__TRAINHUB_PAGE__ || urlPage || 'dashboard';
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    if (el.dataset.page === page) el.classList.add('active');
    else el.classList.remove('active');
    el.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-item[data-page]').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      const p = el.dataset.page;
      if (p) navTo(p);
    });
  });

  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar   = document.querySelector('.sidebar');
  if (toggleBtn && sidebar) {
    toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  }
});
