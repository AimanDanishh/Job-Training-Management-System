function safeExternalUrl(domainAndPath) {
  if (!domainAndPath) return '';
  var clean = String(domainAndPath).replace(/^https?:\/\//i, '').replace(/^\/+/, '');
  return 'https://' + clean;
}

function readTrainHubConfig() {
  var cfg = window.__TRAINHUB_CONFIG__ || {};
  var el = document.getElementById('__trainhub_config__');
  var hasConfig = false;

  if (el && el.getAttribute && el.getAttribute('data-config')) {
    try {
      var raw = el.getAttribute('data-config');
      if (raw) {
        var parsed = JSON.parse(decodeURIComponent(raw));
        cfg = Object.assign({}, cfg, parsed);
        hasConfig = true;
      }
    } catch(e) {}
  } else if (window.__TRAINHUB_CONFIG__ && window.__TRAINHUB_CONFIG__.currentUser) {
    hasConfig = true;
  }

  window.__TRAINHUB_CONFIG__ = cfg;
  if (cfg.page) window.__TRAINHUB_PAGE__ = cfg.page;
  if (cfg.appUrl) {
    window.__APP_URL__ = cfg.appUrl;
    _cachedBaseUrl = cfg.appUrl;
  }
  if (cfg.publicPortalUrl) {
    window.__PUBLIC_PORTAL_URL__ = cfg.publicPortalUrl;
    if (!_cachedBaseUrl) _cachedBaseUrl = cfg.publicPortalUrl;
  }
  if (cfg.companyLogoUrl) window.__COMPANY_LOGO_URL__ = cfg.companyLogoUrl;
  if (cfg.systemLogoUrl) window.__SYSTEM_LOGO_URL__ = cfg.systemLogoUrl;
  if (cfg.currentUser) window.__CURRENT_USER__ = cfg.currentUser;
  if (cfg.queryParams) window.__QUERY_PARAMS__ = cfg.queryParams;

  // Only enforce auth guard once config has actually been loaded
  if (hasConfig) {
    enforceAuthGuard();
  }
  return cfg;
}

function enforceAuthGuard() {
  try {
    const cfg = window.__TRAINHUB_CONFIG__ || {};
    const user = window.__CURRENT_USER__ || (cfg && cfg.currentUser);
    const el = document.getElementById('__trainhub_config__');

    // If config hasn't loaded at all yet, do not block prematurely
    if (!user && !el && typeof document !== 'undefined' && document.readyState === 'loading') {
      return;
    }

    const page = cfg.page || window.__TRAINHUB_PAGE__ || 'dashboard';
    const hasSession = cfg.sessionParam || (typeof window !== 'undefined' && window.location && window.location.search && window.location.search.includes('session='));
    
    // Public pages: 'index' (login) and 'attendance' with participant check-in session parameter
    if (page === 'index' || (page === 'attendance' && hasSession)) {
      return;
    }

    if (!user || user.authenticated !== true) {
      console.warn('[ApolloAuthGuard] Unauthorized client route access blocked for page: ' + page);
      const base = window.__APP_URL__ || window.__PUBLIC_PORTAL_URL__ || '';
      const cleanBase = base ? base.split('?')[0] : '';
      const targetUrl = (cleanBase || window.location.href.split('?')[0]) + '?page=index';
      try {
        window.location.href = targetUrl;
      } catch(e) {
        try { window.location.replace(targetUrl); } catch(rErr) {}
      }
    }
  } catch(guardErr) {}
}

(function() {
  if (typeof document !== 'undefined' && document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      readTrainHubConfig();
    });
  } else {
    readTrainHubConfig();
  }
})();

// ===============================================================================
// ApolloCache - Client-side Session Storage Cache Manager
// ===============================================================================
const ApolloCache = {
  get: function(key) {
    if (!key) return null;
    try {
      if (typeof window === 'undefined' || !window.sessionStorage) return null;
      const raw = sessionStorage.getItem('apollo:' + key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.timestamp || !parsed.ttl) return null;
      if (Date.now() - parsed.timestamp > parsed.ttl) {
        sessionStorage.removeItem('apollo:' + key);
        return null;
      }
      return parsed.data;
    } catch(e) {
      return null;
    }
  },
  set: function(key, data, ttlMs) {
    if (!key || data === undefined) return;
    try {
      if (typeof window === 'undefined' || !window.sessionStorage) return;
      const payload = {
        data: data,
        timestamp: Date.now(),
        ttl: Math.max(Number(ttlMs) || (5 * 60 * 1000), 1000)
      };
      sessionStorage.setItem('apollo:' + key, JSON.stringify(payload));
    } catch(e) {}
  },
  remove: function(key) {
    if (!key) return;
    try {
      if (typeof window !== 'undefined' && window.sessionStorage) {
        sessionStorage.removeItem('apollo:' + key);
      }
    } catch(e) {}
  },
  clear: function() {
    try {
      if (typeof window !== 'undefined' && window.sessionStorage) {
        Object.keys(sessionStorage).forEach(k => {
          if (k.startsWith('apollo:')) sessionStorage.removeItem(k);
        });
      }
    } catch(e) {}
  }
};
window.ApolloCache = ApolloCache;

// --- Global Loading Screen & Animation Overlay ------------------------------
let _activeLoadersCount = 0;
let _loaderTimeout = null;

function showLoadingOverlay(message = 'Processing request...') {
  _activeLoadersCount++;
  let el = document.getElementById('global-loading-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'global-loading-overlay';
    el.className = 'global-loading-overlay';
    el.innerHTML = `
      <div class="loading-card">
        <div class="spinner" style="width:36px;height:36px;border-width:3.5px;border-top-color:#E91C2D;margin:0 auto 12px"></div>

        <div style="font-size:11.5px;color:#64748B;margin-top:4px">Please wait a moment</div>
      </div>
    `;
    document.body.appendChild(el);
  }
  document.getElementById('loading-msg-text').textContent = message;
  el.classList.add('active');
}

function hideLoadingOverlay() {
  _activeLoadersCount = Math.max(0, _activeLoadersCount - 1);
  if (_activeLoadersCount === 0) {
    const el = document.getElementById('global-loading-overlay');
    if (el) el.classList.remove('active');
  }
}

// --- google.script.run wrapper (returns a Promise) ---------------------------
function callServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('Google Apps Script runtime environment not detected. Please run this web application from your deployed Apps Script URL.'));
      return;
    }

    const runner = google.script.run
      .withSuccessHandler(raw => {
        try {
          const res = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (res && res.success === false) reject(new Error(res.message || 'Server error'));
          else resolve(res && res.data !== undefined ? res.data : res);
        } catch(e) { reject(e); }
      })
      .withFailureHandler(e => {
        reject(new Error(e.message || String(e)));
      });

    try {
      if (typeof runner[fnName] !== 'function') {
        reject(new Error(`Server function '${fnName}' does not exist on google.script.run.`));
        return;
      }
      runner[fnName](...args);
    } catch(e) {
      reject(e);
    }
  });
}

// --- Toast notifications -----------------------------------------------------
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast-msg toast-' + type;
  const icons = { success: 'check_circle', error: 'error', info: 'info' };
  t.innerHTML = `<span class="icon filled sm">${icons[type] || 'info'}</span>${message}`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s ease';
    setTimeout(() => t.remove(), 300);
  }, 3500);
}

// --- Button loading state ----------------------------------------------------
function setBtnLoading(btn, loading, text) {
  if (!btn) return;
  if (loading) {
    btn.dataset.origText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> ' + (text || 'Loading...');
    btn.disabled = true;
  } else {
    btn.innerHTML = btn.dataset.origText || text || 'Submit';
    btn.disabled = false;
  }
}

// --- HTML Escape Helper ---------------------------------------------------
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// --- Cross-Origin Safe Query Param Reader ----------------------------------
function getQueryParam(name) {
  try {
    if (window.__TRAINHUB_CONFIG__ && window.__TRAINHUB_CONFIG__.queryParams && window.__TRAINHUB_CONFIG__.queryParams[name]) {
      return window.__TRAINHUB_CONFIG__.queryParams[name];
    }
  } catch(e) {}

  try {
    if (window.__QUERY_PARAMS__ && window.__QUERY_PARAMS__[name]) {
      return window.__QUERY_PARAMS__[name];
    }
  } catch(e) {}

  try {
    if (window.location && window.location.search) {
      const v = new URLSearchParams(window.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.top && window.top !== window && window.top.location) {
      const v = new URLSearchParams(window.top.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      const v = new URLSearchParams(window.parent.location.search).get(name);
      if (v) return v;
    }
  } catch(e) {}

  return null;
}

// --- Topbar Navigation Progress Controller (YouTube / NProgress style) -------
let _navProgressTimer = null;
function startNavProgress(targetPage) {
  let bar = document.getElementById('apollo-nav-progress');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'apollo-nav-progress';
    document.body.appendChild(bar);
  }
  
  // Highlight clicked sidebar item immediately
  try {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      if (item.getAttribute('data-page') === targetPage) {
        item.classList.add('nav-navigating');
      } else {
        item.classList.remove('nav-navigating');
      }
    });
  } catch(e) {}

  bar.style.width = '0%';
  bar.classList.add('active');
  
  if (_navProgressTimer) clearInterval(_navProgressTimer);
  
  let progress = 18;
  bar.style.width = progress + '%';
  
  _navProgressTimer = setInterval(() => {
    if (progress < 65) {
      progress += 14;
    } else if (progress < 88) {
      progress += 3.5;
    } else {
      progress += 0.4;
    }
    if (bar) bar.style.width = Math.min(progress, 96) + '%';
  }, 100);
}

function stopNavProgress() {
  if (_navProgressTimer) clearInterval(_navProgressTimer);
  const bar = document.getElementById('apollo-nav-progress');
  if (bar) {
    bar.style.width = '100%';
    setTimeout(() => {
      bar.classList.remove('active');
      bar.style.width = '0%';
    }, 250);
  }
}

// --- Navigate to page --------------------------------------------------------
function navTo(page, params) {
  // Clean up timers when navigating
  if (window.CountdownTimerManager) {
    window.CountdownTimerManager.stop();
  }

  // 1. Instant Visual Feedback (<10ms)
  startNavProgress(page);

  const navigate = (base) => {
    if (!base) return;
    const cleanBase = String(base || '').split('?')[0];
    let url = cleanBase + '?page=' + page;
    if (params) Object.entries(params).forEach(([k,v]) => url += '&' + k + '=' + encodeURIComponent(v));

    try {
      window.open(url, '_top');
    } catch(e) {
      window.location.href = url;
    }
  };

  if (_cachedBaseUrl) {
    navigate(_cachedBaseUrl);
    return;
  }
  const currentUrl = String(window.location.href || '').split('?')[0];
  if (currentUrl && currentUrl.includes('/exec')) {
    _cachedBaseUrl = currentUrl;
    navigate(currentUrl);
    return;
  }
  google.script.run
    .withSuccessHandler(base => {
      _cachedBaseUrl = base;
      navigate(base);
    })
    .withFailureHandler(() => {
      navigate(currentUrl);
    })
    .getAppUrl();
}

function extractDriveFileId(url) {
  if (!url) return '';
  var str = String(url).trim();
  var match = str.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if (match && match[1]) return match[1];
  var match2 = str.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if (match2 && match2[1]) return match2[1];
  var match3 = str.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]{20,})/);
  if (match3 && match3[1]) return match3[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(str)) return str;
  return '';
}

function convertDriveToDirectImage(url) {
  if (!url) return '';
  var clean = String(url).trim();
  if (clean.includes('drive.google.com') || clean.includes('googleusercontent.com') || /^[a-zA-Z0-9_-]{20,}$/.test(clean)) {
    var fId = extractDriveFileId(clean);
    if (fId) {
      return 'https://drive.google.com/thumbnail?id=' + fId + '&sz=w500';
    }
  }
  return clean;
}

  canvas.width = 400;
  canvas.height = 400;
  const ctx = canvas.getContext('2d');

  const qrImg = new Image();
  qrImg.crossOrigin = 'Anonymous';
  qrImg.onload = () => {
    ctx.drawImage(qrImg, 0, 0, 400, 400);

    const drawLogoOnCanvas = (targetLogoSrc) => {
      const logoImg = new Image();
      if (!targetLogoSrc.startsWith('data:')) logoImg.crossOrigin = 'Anonymous';
      logoImg.onload = () => {
        const lSize = 84;
        const x = (400 - lSize) / 2;
        const y = (400 - lSize) / 2;

        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x - 6, y - 6, lSize + 12, lSize + 12, 10);
        } else {
          ctx.fillRect(x - 6, y - 6, lSize + 12, lSize + 12);
        }
        ctx.fill();
        ctx.stroke();

        ctx.drawImage(logoImg, x, y, lSize, lSize);

        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      logoImg.onerror = () => {
        if (targetLogoSrc !== DEFAULT_FALLBACK_LOGO) {
          drawLogoOnCanvas(DEFAULT_FALLBACK_LOGO);
        } else {
          const link = document.createElement('a');
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }
      };
      logoImg.src = targetLogoSrc;
    };

    drawLogoOnCanvas(logoSrc);
  };
  qrImg.onerror = () => {
    window.open(qrSrc, '_blank');
  };
  qrImg.src = qrSrc;
}

// ===============================================================================
// Real-Time Time-Aware Training Status & Evaluation Countdown Engine
// ===============================================================================

const ApolloCountdown = {
  parseDateSafely(val) {
    if (!val) return null;
    if (val instanceof Date) {
      return !isNaN(val.getTime()) ? new Date(val.getFullYear(), val.getMonth(), val.getDate()) : null;
    }
    const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
    if (!str) return null;
    const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (ymdMatch) {
      return new Date(parseInt(ymdMatch[1], 10), parseInt(ymdMatch[2], 10) - 1, parseInt(ymdMatch[3], 10));
    }
    const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (dmyMatch) {
      return new Date(parseInt(dmyMatch[3], 10), parseInt(dmyMatch[2], 10) - 1, parseInt(dmyMatch[1], 10));
    }
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    return null;
  },

  calculate2WeekDeadline(completionDate) {
    const d = this.parseDateSafely(completionDate);
    if (!d) return null;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 14, 23, 59, 59, 999);
  },

  calculate3MonthDeadline(completionDate) {
    const d = this.parseDateSafely(completionDate);
    if (!d) return null;
    const y = d.getFullYear();
    const m = d.getMonth() + 3;
    const day = d.getDate();
    const targetY = y + Math.floor(m / 12);
    const targetM = m % 12;
    const daysInTargetMonth = new Date(targetY, targetM + 1, 0).getDate();
    const targetDay = Math.min(day, daysInTargetMonth);
    return new Date(targetY, targetM, targetDay, 23, 59, 59, 999);
  },

  getStatus(completionDateInput, deadlineType = '2week', isCompleted = false, isWaiting = false) {
    const is3Mo = deadlineType === '3month';
    const typeLabel = is3Mo ? 'Supervisor Evaluation' : 'Training Evaluation';

    if (isCompleted) {
      return {
        status: 'completed',
        label: `${typeLabel} Completed`,
        badgeText: 'Completed',
        shortText: 'Completed',
        detail: `${typeLabel} is complete`,
        isCompleted: true,
        daysDiff: 0,
        is3Mo: is3Mo
      };
    }

    if (isWaiting || !completionDateInput) {
      return {
        status: 'waiting',
        label: is3Mo ? 'Not Available' : 'Waiting for Training Completion',
        badgeText: is3Mo ? 'Not Available' : 'Waiting for Completion',
        shortText: is3Mo ? 'Not Available' : 'Waiting',
        detail: is3Mo ? 'Evaluation becomes available once training programme ends' : 'Countdowns start once training is completed',
        isWaiting: true,
        daysDiff: 0,
        is3Mo: is3Mo
      };
    }

    const completionDate = this.parseDateSafely(completionDateInput);
    if (!completionDate) {
      return {
        status: 'waiting',
        label: is3Mo ? 'Not Available' : 'Waiting for Training Completion',
        badgeText: is3Mo ? 'Not Available' : 'Waiting for Completion',
        shortText: is3Mo ? 'Not Available' : 'Waiting',
        detail: 'No valid completion date found',
        isWaiting: true,
        daysDiff: 0,
        is3Mo: is3Mo
      };
    }

    const now = new Date();
    const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const compMidnight = new Date(completionDate.getFullYear(), completionDate.getMonth(), completionDate.getDate());
    const compStr = formatMinimalistDate(completionDate);

    // Supervisor Post Evaluation unlocks immediately once training ends
    if (is3Mo) {
      if (todayMidnight.getTime() < compMidnight.getTime()) {
        return {
          status: 'waiting',
          label: 'Not Available',
          badgeText: 'Not Available',
          shortText: 'Not Available',
          detail: `Evaluation unlocks after training ends on ${compStr}`,
          completionDateStr: compStr,
          completionDate: completionDate,
          isWaiting: true,
          daysDiff: 0,
          is3Mo: true
        };
      }

      // Training has ended: Evaluation is Unlocked & Pending
      const daysSinceEnd = Math.round((todayMidnight.getTime() - compMidnight.getTime()) / (1000 * 60 * 60 * 24));
      return {
        status: 'pending',
        label: 'Pending',
        badgeText: 'Pending',
        shortText: 'Pending',
        detail: `Available for supervisor review since ${compStr}`,
        completionDateStr: compStr,
        completionDate: completionDate,
        daysDiff: daysSinceEnd,
        isPending: true,
        isOpen: true,
        is3Mo: true
      };
    }

    const deadline = this.calculate2WeekDeadline(completionDate);
    if (!deadline) {
      return {
        status: 'waiting',
        label: 'Waiting for Training Completion',
        badgeText: 'Waiting for Completion',
        shortText: 'Waiting',
        detail: 'No deadline calculated',
        isWaiting: true,
        daysDiff: 0
      };
    }

    const deadlineMidnight = new Date(deadline.getFullYear(), deadline.getMonth(), deadline.getDate());
    const diffDays = Math.round((deadlineMidnight.getTime() - todayMidnight.getTime()) / (1000 * 60 * 60 * 24));
    const deadStr = formatMinimalistDate(deadline);

    if (diffDays < 0) {
      const overdueDays = Math.abs(diffDays);
      const dayText = overdueDays === 1 ? '1 day' : `${overdueDays} days`;
      return {
        status: 'overdue',
        label: `${typeLabel} Overdue (${dayText} overdue)`,
        badgeText: `Overdue by ${dayText}`,
        shortText: `Overdue by ${dayText}`,
        detail: `Deadline was ${deadStr}`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: diffDays,
        deadlineDate: deadline,
        completionDate: completionDate,
        isOverdue: true,
        is3Mo: false
      };
    }

    if (diffDays === 0) {
      return {
        status: is3Mo ? 'completed' : 'today',
        label: is3Mo ? 'Opens Today' : 'Due Today',
        badgeText: is3Mo ? 'Opens Today' : 'Due Today',
        shortText: is3Mo ? 'Opens Today' : 'Due Today',
        detail: is3Mo ? `Review opens today (${deadStr})` : `Deadline is today (${deadStr})`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: 0,
        deadlineDate: deadline,
        completionDate: completionDate,
        isDueToday: !is3Mo,
        is3Mo: is3Mo,
        isOpen: is3Mo
      };
    }

    if (diffDays === 1) {
      return {
        status: 'approaching',
        label: is3Mo ? 'Opens Tomorrow' : 'Due Tomorrow',
        badgeText: is3Mo ? 'Opens Tomorrow' : 'Due Tomorrow',
        shortText: is3Mo ? 'Opens Tomorrow' : 'Due Tomorrow',
        detail: is3Mo ? `Opens: ${deadStr}` : `Deadline: ${deadStr}`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: 1,
        deadlineDate: deadline,
        completionDate: completionDate,
        isApproaching: true,
        is3Mo: is3Mo
      };
    }

    if (diffDays <= 14) {
      const isApproaching = diffDays <= 5;
      const text = is3Mo ? `Opens in ${diffDays} days` : ((diffDays === 14) ? 'Due in 2 weeks' : `Due in ${diffDays} days`);
      return {
        status: isApproaching ? 'approaching' : 'normal',
        label: text,
        badgeText: text,
        shortText: text,
        detail: is3Mo ? `Opens: ${deadStr}` : `Deadline: ${deadStr}`,
        completionDateStr: compStr,
        deadlineDateStr: deadStr,
        daysDiff: diffDays,
        deadlineDate: deadline,
        completionDate: completionDate,
        isApproaching: isApproaching,
        is3Mo: is3Mo
      };
    }

    const months = Math.max(1, Math.round(diffDays / 30.43));
    const monthText = months === 1 ? '1 month' : `${months} months`;
    const labelText = is3Mo ? `Opens in ${monthText}` : `Due in ${monthText}`;

    return {
      status: 'normal',
      label: labelText,
      badgeText: labelText,
      shortText: labelText,
      detail: is3Mo ? `Opens: ${deadStr}` : `Deadline: ${deadStr}`,
      completionDateStr: compStr,
      deadlineDateStr: deadStr,
      daysDiff: diffDays,
      deadlineDate: deadline,
      completionDate: completionDate,
      is3Mo: is3Mo
    };
  },

  renderBadge(statusObj) {
    if (!statusObj) return '';
    const icons = {
      completed: 'check_circle',
      overdue: 'cancel',
      today: 'warning',
      approaching: 'schedule',
      pending: 'schedule',
      normal: 'schedule',
      waiting: 'hourglass_empty'
    };
    const icon = icons[statusObj.status] || 'schedule';
    return `<span class="countdown-badge cd-${statusObj.status}"><span class="icon sm filled">${icon}</span><span>${statusObj.badgeText || statusObj.label}</span></span>`;
  },

  renderWidget(statusObj, title = 'Evaluation Timeline') {
    if (!statusObj) return '';
    const isCompleted = statusObj.status === 'completed';
    const isOverdue = statusObj.status === 'overdue';
    const isToday = statusObj.status === 'today';
    const isWaiting = statusObj.status === 'waiting';
    const isPending = statusObj.status === 'pending';

    let headerBg = '#F8FAFC';
    let borderColor = '#E2E8F0';
    if (isCompleted) { headerBg = '#F0FDF4'; borderColor = '#BBF7D0'; }
    else if (isOverdue) { headerBg = '#FEF2F2'; borderColor = '#FECACA'; }
    else if (isToday) { headerBg = '#FFF8CF'; borderColor = '#FEC30D'; }
    else if (isPending) { headerBg = '#FFFBEB'; borderColor = '#FDE68A'; }
    else if (statusObj.status === 'approaching') { headerBg = '#FFFBEB'; borderColor = '#FDE68A'; }

    return `
      <div class="card-th" style="background:${headerBg};border:1.5px solid ${borderColor};padding:18px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px">
          <div>
            <div style="font-size:14px;font-weight:800;color:var(--apollo-dark);display:flex;align-items:center;gap:6px">
              <span class="icon" style="color:${isCompleted ? '#16A34A' : isOverdue ? '#E91C2D' : '#FEC30D'}">timer</span>
              ${title}
            </div>
            <div style="font-size:12px;color:var(--apollo-gray-600);margin-top:2px">${statusObj.detail || ''}</div>
          </div>
          <div>
            ${this.renderBadge(statusObj)}
          </div>
        </div>
        ${!isWaiting ? `
          <div class="row g-2" style="font-size:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.06)">
            <div class="col-6 col-md-4">
              <span style="color:var(--apollo-gray-500)">Training Completed:</span>
              <strong style="color:var(--apollo-dark);display:block">${statusObj.completionDateStr || '-'}</strong>
            </div>
            <div class="col-6 col-md-4">
              <span style="color:var(--apollo-gray-500)">${statusObj.is3Mo ? 'Availability:' : 'Target Deadline:'}</span>
              <strong style="color:var(--apollo-dark);display:block">${statusObj.is3Mo ? 'Available Now' : (statusObj.deadlineDateStr || '-')}</strong>
            </div>
            <div class="col-12 col-md-4">
              <span style="color:var(--apollo-gray-500)">Current Status:</span>
              <strong style="color:${isCompleted ? '#16A34A' : isOverdue ? '#E91C2D' : isPending ? '#B45309' : '#111111'};display:block">${statusObj.label}</strong>
            </div>
          </div>
        ` : `
          <div style="font-size:12px;color:var(--apollo-gray-500);padding-top:8px;border-top:1px dashed #CBD5E1">
            Training is currently in progress or not yet marked as completed. Evaluation will automatically become available once the training programme ends.
          </div>
        `}
      </div>
    `;
  }
};

// --- Real-Time Countdown Timer Manager ---------------------------------------
const CountdownTimerManager = {
  _timer: null,
  _callbacks: new Map(),

  start() {
    if (this._timer) clearInterval(this._timer);
    this._timer = setInterval(() => this.tick(), 60000);
  },

  stop() {
    if (this._timer) {
      clearInterval(this._timer);
      this._timer = null;
    }
  },

  register(id, callback) {
    if (!id || typeof callback !== 'function') return;
    this._callbacks.set(id, callback);
    try { callback(); } catch(e) {}
  },

  unregister(id) {
    this._callbacks.delete(id);
  },

  tick() {
    this.refreshAll();
  },

  refreshAll() {
    this._callbacks.forEach(fn => {
      try { fn(); } catch(e) {}
    });

    document.querySelectorAll('[data-apollo-countdown]').forEach(el => {
      const completionDate = el.dataset.completionDate;
      const type = el.dataset.countdownType || '2week';
      const isCompleted = el.dataset.isCompleted === 'true';
      const isWaiting = el.dataset.isWaiting === 'true';
      const statusObj = ApolloCountdown.getStatus(completionDate, type, isCompleted, isWaiting);
      el.innerHTML = ApolloCountdown.renderBadge(statusObj);
    });
  }
};

function isTrainingApproved(training) {
  if (!training) return false;
  const s = String(training.ApprovalStatus || '').trim().toLowerCase();
  if (s === 'approved' || s === 'auto-approved' || s === 'fully approved') return true;
  if (s.includes('return') || s.includes('reject') || s.includes('pending')) return false;
  if (!s) return true;
  return false;
}

function getApprovalRoleText(status) {
  const s = String(status || '').trim();
  if (s.includes('return')) return 'Resubmission / Approval';
  if (s === 'Pending HOD Approval') return 'HOD';
  if (s === 'Pending C-Suite Approval') return 'C-Suite';
  if (s === 'Pending HOHR Approval') return 'HOHR';
  if (s === 'Rejected') return 'Manager (Rejected)';
  return 'HOD / C-Suite / HOHR';
}

function formatMinimalistDate(dateVal) {
  if (!dateVal) return '-';
  const str = String(dateVal).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
  const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmyMatch) return `${dmyMatch[1].padStart(2, '0')}/${dmyMatch[2].padStart(2, '0')}/${dmyMatch[3]}`;
  const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (ymdMatch) return `${ymdMatch[3].padStart(2, '0')}/${ymdMatch[2].padStart(2, '0')}/${ymdMatch[1]}`;
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
  }
  return str.split('T')[0] || '-';
}

function formatDisplayDateRange(startDateVal, endDateVal) {
  if (!startDateVal) return '-';
  const startStr = formatMinimalistDate(startDateVal);
  if (!endDateVal) return startStr;
  const endStr = formatMinimalistDate(endDateVal);
  if (!endStr || startStr === endStr) return startStr;
  return `${startStr} - ${endStr}`;
}

function toInputDateStr(val) {
  if (!val) return '';
  const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;

  const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (ymdMatch) {
    const year = ymdMatch[1];
    const month = ymdMatch[2].padStart(2, '0');
    const day = ymdMatch[3].padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmyMatch) {
    const day = dmyMatch[1].padStart(2, '0');
    const month = dmyMatch[2].padStart(2, '0');
    const year = dmyMatch[3];
    return `${year}-${month}-${day}`;
  }

  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }
  return '';
}

function toDisplayDateStr(val) {
  if (!val) return '';
  const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
  const ymdMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (ymdMatch) {
    const year = ymdMatch[1];
    const month = ymdMatch[2].padStart(2, '0');
    const day = ymdMatch[3].padStart(2, '0');
    return `${day}/${month}/${year}`;
  }
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
  }
  return str;
}

function formatDisplayTime(val, defaultTime = '09:00 AM') {
  if (!val) return defaultTime;
  const str = String(val).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  
  const ampmMatch = str.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (ampmMatch && !str.includes('1899') && !str.includes('Singapore') && !str.includes('Standard') && !str.includes('GMT')) {
    let hh = parseInt(ampmMatch[1], 10);
    const mm = ampmMatch[2];
    const ampm = ampmMatch[3] ? ampmMatch[3].toUpperCase() : (hh >= 12 ? 'PM' : 'AM');
    if (hh > 12) hh = hh % 12;
    if (hh === 0) hh = 12;
    return `${String(hh).padStart(2, '0')}:${mm} ${ampm}`;
  }

  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
  }
  return defaultTime;
}

function formatSessionTimeRange(startVal, endVal) {
  const sTime = formatDisplayTime(startVal, '09:00 AM');
  const eTime = formatDisplayTime(endVal, '05:00 PM');
  return `${sTime} - ${eTime}`;
}

function formatMinimalistDateTime(dateVal) {
  if (!dateVal) return '';
  const str = String(dateVal).replace(/GMT.*$/, '').replace(/\(.*\)$/, '').trim();
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${day}/${month}/${year} ${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
  }
  return str;
}

const LIFECYCLE_STAGES = [
  { id: 'created',      label: 'Training Requested',       icon: 'add_circle' },
  { id: 'participants', label: 'Approved & Participants',  icon: 'group_add' },
  { id: 'attendance',   label: 'Ongoing Attendance',       icon: 'fact_check' },
  { id: 'completed',    label: 'Training Completed',       icon: 'task_alt' },
  { id: 'evaluation',   label: 'Training Eval (2 Weeks)',  icon: 'rate_review', hasCountdown: '2week' },
  { id: 'supervisor',   label: 'Supervisor (3 Months)',    icon: 'schedule',    hasCountdown: '3month' },
  { id: 'closed',       label: 'Programme Closed',         icon: 'verified' }
];

const STAGE_INDEX = {
  'Created': 0,
  'Training Requested': 0,
  'Participants Imported': 1,
  'Approved': 1,
  'Attendance In Progress': 2,
  'Ongoing': 2,
  'Training Completed': 3,
  'Evaluation Completed': 4,
  'Training Evaluation': 4,
  'Post Evaluation': 4,
  'Waiting for 3-Month Review': 5,
  'Supervisor Evaluation': 5,
  'Programme Closed': 6,
  'Closed': 6
};

function renderLifecycle(currentStage, trainingObj) {
  const current = (typeof STAGE_INDEX[currentStage] === 'number') ? STAGE_INDEX[currentStage] : 0;
  const isCompleted = current >= 3;
  const compDate = trainingObj ? (trainingObj.EndDate || trainingObj.StartDate) : null;

  return '<div class="lifecycle">' + LIFECYCLE_STAGES.map((s, i) => {
    const isDone = i < current;
    const isCurr = i === current;
    const cls = isDone ? 'done' : isCurr ? 'current' : '';
    const icon = isDone ? 'check' : s.icon;

    let countdownChip = '';
    if (s.hasCountdown && isCompleted && compDate) {
      const isEvalDone = (s.hasCountdown === '2week' && current >= 4) || (s.hasCountdown === '3month' && current >= 6);
      const st = ApolloCountdown.getStatus(compDate, s.hasCountdown, isEvalDone, false);
      if (!isEvalDone) {
        countdownChip = `<div class="lc-badge cd-${st.status}" style="margin-top:4px;font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700">${st.shortText || st.badgeText}</div>`;
      }
    }

    return `<div class="lc-step ${cls}">
      <div class="lc-dot"><span class="icon sm">${icon}</span></div>
      <div class="lc-label">${s.label}</div>
      ${countdownChip}
    </div>`;
  }).join('') + '</div>';
}

function downloadPdfFromBase64(base64Data, filename) {
  if (!base64Data) {
    showToast('Failed to download PDF: No data returned from server.', 'error');
    return;
  }
  try {
    const byteCharacters = atob(base64Data);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = filename || 'Document.pdf';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  } catch(e) {
    console.error('downloadPdfFromBase64 error:', e);
    showToast('Failed to process PDF download: ' + e.message, 'error');
  }
}

let _cachedDocControlSettings = null;
async function fetchDocumentControl(formId) {
  try {
    if (!_cachedDocControlSettings) {
      const res = await callServer('getDocumentControlSettings');
      _cachedDocControlSettings = (res && res.data) ? res.data : res;
    }
    if (_cachedDocControlSettings && _cachedDocControlSettings[formId]) {
      return _cachedDocControlSettings[formId];
    }
    const single = await callServer('getDocumentControlInfo', formId);
    return (single && single.data) ? single.data : single;
  } catch(e) {
    console.warn('fetchDocumentControl error:', e);
    return null;
  }
}

function formatDocumentNumbers(documentNos, separator) {
  const sep = separator || ' / ';
  if (Array.isArray(documentNos)) {
    const cleaned = documentNos
      .map(n => (n !== null && n !== undefined) ? String(n).trim() : '')
      .filter(n => n.length > 0);
    return cleaned.join(sep);
  }
  if (documentNos !== null && documentNos !== undefined && String(documentNos).trim() !== '') {
    return String(documentNos).trim();
  }
  return '';
}

async function applyDocumentControlBadge(formId, targetElementId, prefix) {

  const info = await fetchDocumentControl(formId);
  if (info) {
    const docNos = Array.isArray(info.documentNos) ? info.documentNos : (info.documentNo ? [info.documentNo] : []);
    const formatted = formatDocumentNumbers(docNos);
    if (formatted) {
      const pfx = prefix !== undefined ? prefix : 'Document No.: ';
      el.textContent = `${pfx}${formatted}`;
    }
  }
}

function loadDocumentControlSettings() {
  if (isDocControlLoading) return;
  isDocControlLoading = true;
  showDocControlLoading();

  function handleSuccess(raw) {
    try {
      const parsed = (typeof raw === 'string') ? JSON.parse(raw) : raw;
      const data = (parsed && parsed.data !== undefined) ? parsed.data : parsed;
      renderDocumentControlSettings(data);
    } catch (err) {
      console.error('Error rendering Document Control settings:', err);
      showDocControlError('Unable to load Document Control settings. Please refresh the page or check the browser console.');
    } finally {
      isDocControlLoading = false;
    }
  }

  function handleFailure(err) {
    console.error('Backend failure getting Document Control settings:', err);
    try {
      showDocControlError('Unable to load Document Control settings. Please refresh the page or check the browser console.');
    } finally {
      isDocControlLoading = false;
    }
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    try {
      google.script.run
        .withSuccessHandler(handleSuccess)
        .withFailureHandler(handleFailure)
        .getDocumentControlSettings();
    } catch (callErr) {
      handleFailure(callErr);
    }
  } else if (typeof callServer === 'function') {
    callServer('getDocumentControlSettings')
      .then(handleSuccess)
      .catch(handleFailure);
  } else {
    handleFailure(new Error('Google Apps Script runtime environment not detected.'));
  }
}

          <td style="border:none; padding:7px 12px; width:26%; word-break:break-word">
            <span style="color:#64748B">Doc. No.:</span> <strong style="color:#0F172A">${docNoStr}</strong>
          </td>
        </tr>
      `;
    }

    container.innerHTML = `
      <div style="font-size:11px; color:#64748B; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center">
        <span><strong>${docNameStr}</strong> &mdash; ISO Document Control Box (Bottom of Final PDF Page)</span>
        <span class="badge-th badge-success" style="font-size:10px">Standardized Layout</span>
      </div>
      <table style="width:100%; border-collapse:collapse; border:1.5px solid #1E293B; font-family:Arial, sans-serif; font-size:11px; background:#FFF">
        <tbody>
          ${rowsHtml}
        </tbody>
      </table>
    `;
  } catch (e) {
    console.error('renderLivePreviewBox error:', e);
  }
}

function addDocNoInputRow(val) {
  const container = document.getElementById('doc-nos-container');
  if (!container) return;
  const row = document.createElement('div');
  row.className = 'doc-no-row';
  row.style.cssText = 'display:flex; gap:8px; align-items:center;';
  row.innerHTML = `
    <div style="flex:1">
      <input type="text" class="input-th doc-no-input" style="font-family:monospace; font-weight:700" placeholder="e.g. S-HRS-FM-009" value="${escapeHtml(val || '')}" oninput="onModalFieldChange()" required>
    </div>
    <button type="button" class="btn-th btn-secondary btn-sm" onclick="removeDocNoInputRow(this)" style="color:#EF4444; border-color:#FECACA; padding:8px 12px;" title="Remove this document number">
      <span class="icon sm" style="font-size:14px">delete</span> Remove
    </button>
  `;
  container.appendChild(row);
  onModalFieldChange();
}

function removeDocNoInputRow(btn) {
  const container = document.getElementById('doc-nos-container');
  if (!container) return;
  const rows = container.querySelectorAll('.doc-no-row');
  if (rows.length <= 1) {
    showToast('At least one Document Number is required.', 'error');
    return;
  }
  const row = btn ? btn.closest('.doc-no-row') : null;
  if (row) {
    row.remove();
    onModalFieldChange();
  }
}

function getModalDocumentNos() {
  const container = document.getElementById('doc-nos-container');
  if (!container) return [];
  const inputs = Array.from(container.querySelectorAll('.doc-no-input'));
  return inputs.map(i => i.value.trim()).filter(v => v.length > 0);
}

function openDocEditModal(id) {
  if (!currentDocControlData || !currentDocControlData[id]) return;
  const item = currentDocControlData[id];

  const editId = document.getElementById('edit-doc-id');
  const editName = document.getElementById('edit-doc-name');
  const editRev = document.getElementById('edit-doc-rev');
  const editOrig = document.getElementById('edit-doc-originator');
  const editDate = document.getElementById('edit-doc-date');
  if (editId) editId.value = id;
  if (editName) editName.value = item.documentName || '';
  if (editRev) editRev.value = item.revisionNo !== undefined ? item.revisionNo : '0';
  if (editOrig) editOrig.value = item.originator || '';
  if (editDate) editDate.value = item.effectiveDate || '';

  const container = document.getElementById('doc-nos-container');
  if (container) {
    container.innerHTML = '';
    const nos = Array.isArray(item.documentNos) && item.documentNos.length > 0
      ? item.documentNos
      : (item.documentNo ? [item.documentNo] : ['']);
    nos.forEach(no => addDocNoInputRow(no));
  }

  const titleEl = document.getElementById('modal-doc-title');
  const intIdEl = document.getElementById('modal-doc-internal-id');
  if (titleEl) titleEl.textContent = `Edit Document Control: ${item.documentName || id}`;
  if (intIdEl) intIdEl.textContent = `Permanent Internal ID: ${id}`;

  onModalFieldChange();
  const modal = document.getElementById('modal-edit-doc-control');
  if (modal) modal.style.display = 'flex';
}

function closeDocEditModal() {
  const modal = document.getElementById('modal-edit-doc-control');
  if (modal) modal.style.display = 'none';
}

function onModalFieldChange() {
  const revEl = document.getElementById('edit-doc-rev');
  const origEl = document.getElementById('edit-doc-originator');
  const dateEl = document.getElementById('edit-doc-date');
  const rev = revEl ? revEl.value || '0' : '0';
  const orig = origEl ? origEl.value || '-' : '-';
  const date = dateEl ? dateEl.value || '-' : '-';
  
  const nos = getModalDocumentNos();
  const formattedNos = formatDocumentNumbers(nos.length > 0 ? nos : ['-']);
  const isMultiLine = formattedNos.length > 28;

  const box = document.getElementById('modal-live-preview-box');
  if (!box) return;

  let rowsHtml = '';
  if (isMultiLine) {
    rowsHtml = `
      <tr>
        <td style="border:none; padding:5px 8px; width:22%; white-space:nowrap">
          <span style="color:#64748B">Revision No:</span> <strong style="color:#0F172A">${escapeHtml(rev)}</strong>
        </td>
        <td style="border:none; padding:5px 8px; width:48%">
          <span style="color:#64748B">Originator:</span> <strong style="color:#0F172A">${escapeHtml(orig)}</strong>
        </td>
        <td style="border:none; padding:5px 8px; width:30%; white-space:nowrap">
          <span style="color:#64748B">Effective Date:</span> <strong style="color:#0F172A">${escapeHtml(date)}</strong>
        </td>
      </tr>
      <tr>
        <td colspan="3" style="border:none; padding:5px 8px; word-break:break-word">
          <span style="color:#64748B">Doc. No.:</span> <strong style="color:#0F172A">${escapeHtml(formattedNos)}</strong>
        </td>
      </tr>
    `;
  } else {
    rowsHtml = `
      <tr>
        <td style="border:none; padding:5px 8px; width:18%; white-space:nowrap">
          <span style="color:#64748B">Revision No:</span> <strong style="color:#0F172A">${escapeHtml(rev)}</strong>
        </td>
        <td style="border:none; padding:5px 8px; width:34%">
          <span style="color:#64748B">Originator:</span> <strong style="color:#0F172A">${escapeHtml(orig)}</strong>
        </td>
        <td style="border:none; padding:5px 8px; width:22%; white-space:nowrap">
          <span style="color:#64748B">Effective Date:</span> <strong style="color:#0F172A">${escapeHtml(date)}</strong>
        </td>
        <td style="border:none; padding:5px 8px; width:26%; word-break:break-word">
          <span style="color:#64748B">Doc. No.:</span> <strong style="color:#0F172A">${escapeHtml(formattedNos)}</strong>
        </td>
      </tr>
    `;
  }

  box.innerHTML = `
    <table style="width:100%; border-collapse:collapse; border:1.5px solid #1E293B; font-family:Arial, sans-serif; font-size:10px; background:#FFF">
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>
  `;
}

async function saveDocEditModal() {
  const idEl = document.getElementById('edit-doc-id');
  const nameEl = document.getElementById('edit-doc-name');
  const revEl = document.getElementById('edit-doc-rev');
  const origEl = document.getElementById('edit-doc-originator');
  const dateEl = document.getElementById('edit-doc-date');
  if (!idEl || !nameEl) return;

  const id = idEl.value;
  const name = nameEl.value.trim();
  const rev = revEl ? revEl.value.trim() : '0';
  const orig = origEl ? origEl.value.trim() : '';
  const date = dateEl ? dateEl.value.trim() : '';

  const container = document.getElementById('doc-nos-container');
  const inputs = container ? Array.from(container.querySelectorAll('.doc-no-input')) : [];
  const docNos = [];
  const seen = new Set();

  for (const inp of inputs) {
    const val = inp.value.trim();
    if (!val) continue;
    const lower = val.toLowerCase();
    if (seen.has(lower)) {
      showToast('Duplicate document numbers are not allowed.', 'error');
      inp.focus();
      return;
    }
    seen.add(lower);
    docNos.push(val);
  }

  if (docNos.length === 0) {
    showToast('Please provide at least one Document Number.', 'error');
    return;
  }

  if (!name || rev === '' || !orig || !date) {
    showToast('Please complete all required document control fields.', 'error');
    return;
  }

  if (!currentDocControlData) currentDocControlData = {};
  currentDocControlData[id] = {
    documentName: name,
    documentNos: docNos,
    documentNo: formatDocumentNumbers(docNos),
    revisionNo: rev,
    originator: orig,
    effectiveDate: date
  };

  try {
    showLoadingOverlay('Saving Document Control settings...');
    const res = await callServer('saveDocumentControlSettings', currentDocControlData);
    hideLoadingOverlay();
    const savedData = (res && res.data) ? res.data : res;
    currentDocControlData = savedData;
    closeDocEditModal();
    renderDocControl(currentDocControlData);
    showToast('Document control settings saved successfully!', 'success');
  } catch(e) {
    hideLoadingOverlay();
    showToast('Save error: ' + e.message, 'error');
  }
}

async function saveAllDocControlSettings() {
  if (!currentDocControlData) {
    showToast('No document control settings loaded.', 'error');
    return;
  }
  try {
    showLoadingOverlay('Saving Document Control settings...');
    const res = await callServer('saveDocumentControlSettings', currentDocControlData);
    hideLoadingOverlay();
    const savedData = (res && res.data) ? res.data : res;
    currentDocControlData = savedData;
    renderDocControl(currentDocControlData);
    showToast('Document control settings saved successfully.', 'success');
  } catch(e) {
    hideLoadingOverlay();
    showToast('Save error: ' + e.message, 'error');
  }
}
