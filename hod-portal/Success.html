  <script>
    const ACTION_CONTENT_MAP = {
      'approve': {
        title: 'Request Approved Successfully',
        message: 'The training request has been successfully approved.'
      },
      'approved': {
        title: 'Request Approved Successfully',
        message: 'The training request has been successfully approved.'
      },
      'reject': {
        title: 'Request Rejected Successfully',
        message: 'The training request has been successfully rejected.'
      },
      'rejected': {
        title: 'Request Rejected Successfully',
        message: 'The training request has been successfully rejected.'
      },
      'return': {
        title: 'Request Returned Successfully',
        message: 'The training request has been successfully returned to the requester for further action.'
      },
      'returned': {
        title: 'Request Returned Successfully',
        message: 'The training request has been successfully returned to the requester for further action.'
      }
    };

    const FALLBACK_ACTION_CONTENT = {
      title: 'Request Processed Successfully',
      message: 'The training request action has been successfully processed.'
    };

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      syncContentFromClientUrl();
    });

    function initTheme() {
      const savedTheme = localStorage.getItem('portal_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.body.classList.contains('theme-light') ? 'light' : 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
      localStorage.setItem('portal_theme', newTheme);
    }

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.remove('theme-dark');
        document.body.classList.add('theme-light');
        const icon = document.getElementById('themeToggleIcon');
        const label = document.getElementById('themeToggleLabel');
        if (icon) icon.innerText = '☀️';
        if (label) label.innerText = 'Light';
      } else {
        document.body.classList.remove('theme-light');
        document.body.classList.add('theme-dark');
        const icon = document.getElementById('themeToggleIcon');
        const label = document.getElementById('themeToggleLabel');
        if (icon) icon.innerText = '🌙';
        if (label) label.innerText = 'Dark';
      }
    }

    function syncContentFromClientUrl() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const actionParam = (urlParams.get('action') || '').toLowerCase().trim();
        const idParam = (urlParams.get('id') || urlParams.get('trainingId') || urlParams.get('req') || '').trim();

        if (actionParam) {
          const cfg = ACTION_CONTENT_MAP[actionParam] || FALLBACK_ACTION_CONTENT;
          const titleEl = document.getElementById('successTitle');
          const msgEl = document.getElementById('successMessage');
          if (titleEl) titleEl.innerText = cfg.title;
          if (msgEl) msgEl.innerText = cfg.message;
        }

        const idContainer = document.getElementById('successRequestIdContainer');
        const idText = document.getElementById('successRequestIdText');
        if (idParam) {
          if (idText) idText.innerText = idParam;
          if (idContainer) idContainer.style.display = 'inline-flex';
        } else if (!idText || !idText.innerText.trim()) {
          if (idContainer) idContainer.style.display = 'none';
        }
      } catch (e) {
        console.warn('URL parameter sync notice:', e);
      }
    }

    function navigateToRequests(e) {
      if (e) e.preventDefault();
      const appUrlStr = '<?= (typeof appUrl !== "undefined" && appUrl) ? appUrl : "" ?>';
      const cleanBase = appUrlStr ? appUrlStr.split('?')[0] : window.location.href.split('?')[0];
      const targetUrl = cleanBase + '?page=review';
      try {
        if (window.top && window.top.location) {
          window.top.location.href = targetUrl;
          return;
        }
      } catch (err) {}
      window.location.href = targetUrl;
    }
  </script>
</body>
</html>
